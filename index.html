const L=(en,ru,uz)=>({en,ru,uz});

const ASPECTS=[
{id:"FND",n:L("CRM foundations","Основы CRM","CRM asoslari"),
 i:L("CRM grew out of accident investigations in the 1970s that showed most accidents involved breakdowns in teamwork, not technical failures. Today it is mandatory training for flight and cabin crew and is assessed through behavioural markers.",
     "CRM появилась в 1970-х годах после расследований, показавших, что большинство катастроф связаны со сбоями командной работы, а не с техническими отказами. Сегодня это обязательная подготовка для лётных экипажей и бортпроводников, оцениваемая по поведенческим маркерам.",
     "CRM 1970-yillarda koʻp halokatlar texnik nosozlik emas, balki jamoaviy ishdagi uzilishlar bilan bogʻliqligini koʻrsatgan tergovlardan soʻng paydo boʻldi. Bugun bu uchuvchilar va bort kuzatuvchilari uchun majburiy tayyorgarlik boʻlib, xulq-atvor belgilari orqali baholanadi."),
 t:[L("Learn NOTECHS, LOSA, LOFT and EBT — they appear in every CRM course.","Выучите NOTECHS, LOSA, LOFT и EBT — они встречаются в каждом курсе CRM.","NOTECHS, LOSA, LOFT va EBT ni oʻrganing — ular har bir CRM kursida uchraydi."),
    L("Read one accident report a week and find where CRM broke down.","Читайте один отчёт о расследовании в неделю и находите, где нарушилась CRM.","Haftasiga bitta tergov hisobotini oʻqing va CRM qayerda buzilganini toping."),
    L("Ask your instructor which behavioural markers your operator uses.","Узнайте у инструктора, какие поведенческие маркеры использует ваш эксплуатант.","Instruktoringizdan aviakompaniyangiz qaysi xulq-atvor belgilaridan foydalanishini soʻrang.")]},
{id:"COM",n:L("Communication","Коммуникация","Muloqot"),
 i:L("Most CRM failures begin as communication failures. Good communication is clear, closed-loop, timely — and assertive when safety is at stake.",
     "Большинство сбоев CRM начинаются как сбои коммуникации. Хорошая коммуникация — чёткая, замкнутая, своевременная и настойчивая, когда речь идёт о безопасности.",
     "CRM dagi koʻp uzilishlar muloqotdagi uzilishdan boshlanadi. Yaxshi muloqot — aniq, yopiq siklli, oʻz vaqtida va xavfsizlik masalasida qatʼiy."),
 t:[L("Practise closed-loop: read back every instruction and confirm the hear-back.","Тренируйте замкнутую связь: повторяйте каждое указание и подтверждайте правильность повтора.","Yopiq siklni mashq qiling: har bir koʻrsatmani takrorlang va takror toʻgʻriligini tasdiqlang."),
    L("Rehearse PACE and CUS phrases aloud so they come naturally under pressure.","Проговаривайте вслух фразы PACE и CUS, чтобы под давлением они звучали естественно.","PACE va CUS iboralarini ovoz chiqarib takrorlang, shunda bosim ostida tabiiy chiqadi."),
    L("End every briefing with an open question: “Any concerns?”","Заканчивайте каждый брифинг открытым вопросом: «Есть ли опасения?»","Har bir brifingni ochiq savol bilan tugating: «Xavotirlar bormi?»")]},
{id:"SA",n:L("Situation awareness","Ситуационная осведомлённость","Vaziyatni anglash"),
 i:L("Situation awareness means knowing what is happening and what will happen next. It is easily lost through fixation, distraction or automation surprises.",
     "Ситуационная осведомлённость — понимание того, что происходит и что будет дальше. Её легко потерять из-за фиксации, отвлечения или «сюрпризов» автоматики.",
     "Vaziyatni anglash — nima boʻlayotganini va keyin nima boʻlishini bilish. U qotib qolish, chalgʻish yoki avtomatika syurprizlari tufayli oson yoʻqoladi."),
 t:[L("Call out and verify every FMA change.","Озвучивайте и проверяйте каждое изменение на FMA.","FMA dagi har bir oʻzgarishni aytib, tekshiring."),
    L("Use the SA red-flag list in debriefs to spot early signs.","Используйте на разборах список признаков потери SA, чтобы замечать их раньше.","Debrifinglarda SA yoʻqolishi belgilari roʻyxatidan foydalanib, ularni erta payqang."),
    L("Ask regularly: where are we, where should we be, what comes next?","Регулярно спрашивайте себя: где мы, где должны быть, что дальше?","Muntazam soʻrang: qayerdamiz, qayerda boʻlishimiz kerak, keyin nima?")]},
{id:"DM",n:L("Decision making","Принятие решений","Qaror qabul qilish"),
 i:L("Good decisions follow a structured model, weigh more than one option and are reviewed after execution. Time pressure and plan continuation bias are the main enemies.",
     "Хорошие решения принимаются по структурированной модели, учитывают больше одного варианта и проверяются после выполнения. Главные враги — дефицит времени и склонность к продолжению плана.",
     "Yaxshi qarorlar tuzilmali model asosida qabul qilinadi, bittadan ortiq variantni koʻrib chiqadi va bajarilgandan soʻng tekshiriladi. Asosiy dushmanlar — vaqt bosimi va rejani davom ettirishga moyillik."),
 t:[L("Run FORDEC or T-DODAR on paper for one past flight event.","Разберите на бумаге одно прошлое событие по FORDEC или T-DODAR.","Bitta oʻtgan parvoz voqeasini qogʻozda FORDEC yoki T-DODAR boʻyicha tahlil qiling."),
    L("Always state at least two options before deciding.","Перед решением всегда называйте минимум два варианта.","Qaror qabul qilishdan oldin har doim kamida ikkita variantni ayting."),
    L("Set decision gates before the approach, not during it.","Устанавливайте рубежи принятия решений до захода, а не во время него.","Qaror chegaralarini yaqinlashuv paytida emas, undan oldin belgilang.")]},
{id:"LTW",n:L("Leadership & teamwork","Лидерство и командная работа","Yetakchilik va jamoaviy ish"),
 i:L("The captain sets the tone: a balanced authority gradient lets everyone speak up while leadership stays clear. Good followers support the leader by monitoring and challenging.",
     "Тон задаёт командир: сбалансированный градиент власти позволяет каждому высказываться при ясном лидерстве. Хорошие ведомые поддерживают лидера, контролируя и возражая при необходимости.",
     "Ohangni kapitan belgilaydi: muvozanatli hokimiyat gradienti aniq yetakchilik saqlangan holda har kimga fikr bildirish imkonini beradi. Yaxshi ergashuvchilar nazorat va eʼtiroz orqali yetakchini qoʻllab-quvvatlaydi."),
 t:[L("Open each briefing by inviting the crew to speak up about anything.","Начинайте брифинг с приглашения экипажа высказываться о любых проблемах.","Har bir brifingni ekipajni har qanday masalada fikr bildirishga taklif qilish bilan boshlang."),
    L("Review a case where a first officer had to challenge a captain: what helped, what blocked?","Разберите случай, когда второму пилоту пришлось возразить командиру: что помогло, что мешало?","Ikkinchi uchuvchi kapitanga eʼtiroz bildirishi kerak boʻlgan holatni tahlil qiling: nima yordam berdi, nima toʻsqinlik qildi?"),
    L("Delegate with who / what / when.","Делегируйте по схеме «кто / что / когда».","«Kim / nima / qachon» tarzida topshiring.")]},
{id:"WLM",n:L("Workload management","Управление нагрузкой","Ish yukini boshqarish"),
 i:L("Workload must be planned and shared. When tasks pile up, fly the aircraft first, delegate and buy time.",
     "Нагрузку нужно планировать и распределять. Когда задачи накапливаются — сначала пилотируйте, делегируйте и выигрывайте время.",
     "Ish yukini rejalashtirish va taqsimlash kerak. Vazifalar toʻplanganda — avval boshqaring, topshiring va vaqt yuting."),
 t:[L("Prepare and brief before high-workload phases.","Готовьтесь и проводите брифинг до этапов высокой нагрузки.","Yuqori yuklama bosqichlaridan oldin tayyorlaning va brifing qiling."),
    L("Apply Aviate – Navigate – Communicate in every scenario.","Применяйте порядок «пилотируй – навигируй – связывайся» в каждом сценарии.","Har bir ssenariyda «boshqar – yoʻnaltir – aloqa qil» tartibini qoʻllang."),
    L("When overloaded, ask for vectors or a hold to buy time.","При перегрузке запросите векторение или зону ожидания, чтобы выиграть время.","Yuklama oshganda vaqt yutish uchun vektor yoki kutish zonasini soʻrang.")]},
{id:"TEM",n:L("Threat & error management","Управление угрозами и ошибками","Tahdid va xatolarni boshqarish"),
 i:L("TEM accepts that threats and errors will happen. The aim is to anticipate threats, catch errors early and recover before an undesired aircraft state develops.",
     "TEM исходит из того, что угрозы и ошибки неизбежны. Цель — предвидеть угрозы, рано обнаруживать ошибки и исправлять их до возникновения нежелательного состояния ВС.",
     "TEM tahdid va xatolar muqarrar ekanidan kelib chiqadi. Maqsad — tahdidlarni oldindan koʻrish, xatolarni erta aniqlash va nomaqbul holat yuzaga kelmasdan tuzatish."),
 t:[L("In every briefing, name the top three threats and a countermeasure for each.","На каждом брифинге называйте три главные угрозы и контрмеру для каждой.","Har bir brifingda uchta asosiy tahdidni va har biriga qarshi chorani ayting."),
    L("Classify recent events as threat, error or undesired aircraft state.","Классифицируйте недавние события: угроза, ошибка или нежелательное состояние ВС.","Soʻnggi voqealarni tasniflang: tahdid, xato yoki nomaqbul holat."),
    L("Treat a go-around as a normal tool, not a failure.","Воспринимайте уход на второй круг как обычный инструмент, а не как неудачу.","Ikkinchi aylanishni muvaffaqiyatsizlik emas, oddiy vosita deb biling.")]},
{id:"HF",n:L("Human factors","Человеческий фактор","Inson omili"),
 i:L("Human performance has limits. Fatigue, stress, complacency and hazardous attitudes affect every crew member — knowing them is the first line of defence.",
     "Возможности человека ограничены. Усталость, стресс, самоуспокоенность и опасные установки влияют на каждого — знание о них является первой линией защиты.",
     "Inson imkoniyatlari cheklangan. Charchoq, stress, xotirjamlik va xavfli munosabatlar har bir aʼzoga taʼsir qiladi — ularni bilish birinchi himoya chizigʻi."),
 t:[L("Run IMSAFE honestly before every duty.","Честно проходите IMSAFE перед каждой сменой.","Har bir navbatchilikdan oldin IMSAFE ni halol bajaring."),
    L("Learn the five hazardous attitudes and their antidotes.","Выучите пять опасных установок и их «противоядия».","Beshta xavfli munosabat va ularning «davosi»ni oʻrganing."),
    L("Report fatigue — it is a safety issue, not a weakness.","Сообщайте об усталости — это вопрос безопасности, а не слабость.","Charchoq haqida xabar bering — bu zaiflik emas, xavfsizlik masalasi.")]}
];

/* Glossary: id, aspect, abbreviation, English expansion, localized name, localized definition */
const T=(id,a,ab,full,n,d)=>({id,a,ab,full,n,d});
const TERMS=[
T("crm","FND","CRM","Crew Resource Management",L("Crew Resource Management","Управление ресурсами экипажа","Ekipaj resurslarini boshqarish"),
 L("Using all available resources — people, equipment and information — to achieve safe and efficient flight operations.","Эффективное использование всех доступных ресурсов — людей, оборудования и информации — для безопасного и эффективного выполнения полётов.","Xavfsiz va samarali parvoz uchun barcha mavjud resurslardan — odamlar, uskunalar va axborotdan — samarali foydalanish.")),
T("notechs","FND","NOTECHS","Non-Technical Skills",L("NOTECHS behavioural markers","Поведенческие маркеры NOTECHS","NOTECHS xulq-atvor belgilari"),
 L("European framework for assessing pilots' non-technical skills in four categories: cooperation, leadership and managerial skills, situation awareness and decision making.","Европейская система оценки нетехнических навыков пилотов по четырём категориям: взаимодействие, лидерство и управленческие навыки, ситуационная осведомлённость и принятие решений.","Uchuvchilarning notexnik koʻnikmalarini toʻrt toifa boʻyicha baholash uchun Yevropa tizimi: hamkorlik, yetakchilik va boshqaruv, vaziyatni anglash va qaror qabul qilish.")),
T("losa","FND","LOSA","Line Operations Safety Audit",L("Line Operations Safety Audit","Аудит безопасности линейных полётов","Liniya parvozlari xavfsizligi auditi"),
 L("Trained observers ride the jump seat on normal flights and record threats, errors and crew countermeasures anonymously, without judging the crew.","Подготовленные наблюдатели на обычных рейсах анонимно фиксируют угрозы, ошибки и контрмеры экипажа, не оценивая сам экипаж.","Tayyorlangan kuzatuvchilar oddiy reyslarda tahdidlar, xatolar va ekipaj qarshi choralarini anonim qayd etadi, ekipajni baholamaydi.")),
T("loft","FND","LOFT","Line-Oriented Flight Training",L("Line-Oriented Flight Training","Тренажёрная подготовка, ориентированная на линейные полёты","Liniya parvozlariga yoʻnaltirilgan trenajyor tayyorgarligi"),
 L("A full-flight simulator session that recreates a realistic line flight in real time, so the crew practises CRM and technical skills together.","Сессия на тренажёре, воспроизводящая реальный линейный полёт в реальном времени, чтобы экипаж отрабатывал CRM и технические навыки вместе.","Real vaqtda haqiqiy liniya parvozini takrorlaydigan trenajyor mashgʻuloti; ekipaj CRM va texnik koʻnikmalarni birga mashq qiladi.")),
T("mcc","FND","MCC","Multi-Crew Cooperation",L("Multi-Crew Cooperation","Взаимодействие в многочленном экипаже","Koʻp aʼzoli ekipajda hamkorlik"),
 L("Training that teaches pilots to operate as a team in a multi-pilot aircraft: role division, call-outs, cross-checks and shared procedures.","Подготовка к работе в составе многочленного экипажа: распределение ролей, доклады, перекрёстный контроль и общие процедуры.","Koʻp uchuvchili havo kemasida jamoa boʻlib ishlashga oʻrgatish: rollarni taqsimlash, maʼlumotlar, oʻzaro nazorat va umumiy tartiblar.")),
T("sop","FND","SOP","Standard Operating Procedures",L("Standard Operating Procedures","Стандартные эксплуатационные процедуры","Standart ekspluatatsiya tartiblari"),
 L("The operator's agreed way of doing each task. They make crew actions predictable, so any deviation is easy to spot.","Установленный эксплуатантом порядок выполнения каждой задачи. Они делают действия экипажа предсказуемыми, поэтому любое отклонение легко заметить.","Har bir vazifani bajarishning aviakompaniya tomonidan belgilangan tartibi. Ular ekipaj harakatlarini oldindan aytib boʻladigan qiladi, shuning uchun har qanday chetga chiqish oson seziladi.")),
T("ebt","FND","EBT","Evidence-Based Training",L("Evidence-Based Training","Подготовка на основе фактических данных","Dalillarga asoslangan tayyorgarlik"),
 L("Training built on operational data and the core pilot competencies (ICAO Doc 9995) instead of a fixed list of manoeuvres.","Подготовка, основанная на эксплуатационных данных и базовых компетенциях пилота (ICAO Doc 9995), а не на фиксированном перечне манёвров.","Qatʼiy manyovrlar roʻyxati oʻrniga ekspluatatsiya maʼlumotlari va uchuvchining asosiy kompetensiyalariga (ICAO Doc 9995) asoslangan tayyorgarlik.")),
T("just","FND","","",L("Just culture","Справедливая культура","Adolatli madaniyat"),
 L("An environment where people report errors without fear of blame, while gross negligence and wilful violations remain unacceptable.","Среда, в которой люди сообщают об ошибках без страха наказания, но грубая небрежность и умышленные нарушения остаются недопустимыми.","Odamlar xatolar haqida jazodan qoʻrqmasdan xabar beradigan muhit; ammo qoʻpol eʼtiborsizlik va qasddan qoidabuzarlik qabul qilinmaydi.")),

T("hf","HF","","",L("Human factors","Человеческий фактор","Inson omili"),
 L("The study of human capabilities and limitations and how they interact with equipment, procedures and the environment.","Изучение возможностей и ограничений человека и их взаимодействия с техникой, процедурами и средой.","Inson imkoniyatlari va cheklovlarini hamda ularning texnika, tartiblar va muhit bilan oʻzaro taʼsirini oʻrganish.")),
T("shell","HF","SHELL","Software, Hardware, Environment, Liveware, Liveware",L("SHELL model","Модель SHELL","SHELL modeli"),
 L("A model with the human (Liveware) at the centre, interacting with Software (procedures), Hardware, Environment and other people. Problems arise at mismatched interfaces.","Модель, в центре которой человек (Liveware), взаимодействующий с Software (процедуры), Hardware (техника), Environment (среда) и другими людьми. Проблемы возникают на несогласованных интерфейсах.","Markazda inson (Liveware) turadigan model: u Software (tartiblar), Hardware (texnika), Environment (muhit) va boshqa odamlar bilan oʻzaro taʼsirda. Muammolar mos kelmaydigan interfeyslarda yuzaga keladi.")),
T("swiss","HF","","",L("Swiss cheese model","Модель «швейцарского сыра»","«Shveytsariya pishlogʻi» modeli"),
 L("James Reason's model: every defence layer has holes (active failures and latent conditions). An accident happens when the holes line up.","Модель Джеймса Ризона: в каждом защитном слое есть «дыры» (активные ошибки и скрытые условия). Происшествие случается, когда дыры совпадают.","Jeyms Rizon modeli: har bir himoya qatlamida «teshiklar» bor (faol xatolar va yashirin sharoitlar). Teshiklar bir chiziqqa tushganda hodisa yuz beradi.")),
T("dirty","HF","","",L("Dirty Dozen","«Грязная дюжина»","«Iflos oʻn ikkilik»"),
 L("Twelve common causes of human error, such as lack of communication, complacency, fatigue, pressure, distraction, lack of assertiveness and unsafe norms.","Двенадцать типичных причин ошибок человека, например: недостаток коммуникации, самоуспокоенность, усталость, давление, отвлечение, недостаток настойчивости и небезопасные «нормы».","Inson xatosining oʻn ikki keng tarqalgan sababi: masalan, muloqot yetishmasligi, xotirjamlik, charchoq, bosim, chalgʻish, qatʼiyat yetishmasligi va xavfli «normalar».")),
T("imsafe","HF","IMSAFE","Illness, Medication, Stress, Alcohol, Fatigue, Eating",L("IMSAFE checklist","Чек-лист IMSAFE","IMSAFE nazorat roʻyxati"),
 L("A personal fitness self-check before duty: Illness, Medication, Stress, Alcohol, Fatigue, Eating (or Emotion).","Самопроверка готовности к полёту: болезнь, лекарства, стресс, алкоголь, усталость, питание (или эмоции).","Navbatchilikdan oldin oʻz holatini tekshirish: kasallik, dorilar, stress, alkogol, charchoq, ovqatlanish (yoki hissiyot).")),
T("frms","HF","FRMS","Fatigue Risk Management System",L("Fatigue risk management","Управление риском усталости","Charchoq xavfini boshqarish"),
 L("Fatigue degrades attention, memory and decision making. A data-driven system manages this risk using sleep data, duty patterns and crew reports.","Усталость ухудшает внимание, память и принятие решений. Система на основе данных управляет этим риском, используя данные о сне, графики работы и донесения экипажей.","Charchoq diqqat, xotira va qaror qabul qilishni yomonlashtiradi. Maʼlumotlarga asoslangan tizim bu xavfni uyqu maʼlumotlari, ish jadvali va ekipaj xabarlari orqali boshqaradi.")),
T("complacency","HF","","",L("Complacency","Самоуспокоенность","Xotirjamlik (beparvolik)"),
 L("Overconfidence from routine or reliable automation that reduces vigilance and monitoring.","Излишняя уверенность из-за рутины или надёжной автоматики, снижающая бдительность и контроль.","Odatiy ish yoki ishonchli avtomatika tufayli haddan tashqari ishonch; hushyorlik va nazoratni pasaytiradi.")),
T("hazatt","HF","","",L("Hazardous attitudes","Опасные установки","Xavfli munosabatlar"),
 L("Five attitudes that lead to poor judgement: anti-authority, impulsivity, invulnerability, macho and resignation. Each has an antidote thought.","Пять установок, ведущих к ошибочным суждениям: протест против авторитета, импульсивность, неуязвимость, «мачо» и покорность. Для каждой есть «противоядие».","Notoʻgʻri xulosaga olib keladigan besh munosabat: hokimiyatga qarshilik, impulsivlik, zaxmsizlik, «macho» va taslim boʻlish. Har biriga qarshi fikr bor.")),
T("stress","HF","","",L("Stress and performance (Yerkes–Dodson)","Стресс и работоспособность (Йеркс–Додсон)","Stress va ish qobiliyati (Yerks–Dodson)"),
 L("Performance rises with arousal up to an optimum, then falls. Too little stress causes boredom; too much narrows attention.","Работоспособность растёт с уровнем возбуждения до оптимума, затем падает. Мало стресса — скука, слишком много — сужение внимания.","Ish qobiliyati qoʻzgʻalish darajasi bilan optimumgacha oshadi, keyin pasayadi. Stress kam boʻlsa — zerikish, haddan ortiq boʻlsa — diqqat torayadi.")),

T("closedloop","COM","","",L("Closed-loop communication","Замкнутая коммуникация","Yopiq sikldagi muloqot"),
 L("The sender transmits, the receiver reads back, the sender confirms. The loop is closed only when both agree the message was understood.","Отправитель передаёт, получатель повторяет, отправитель подтверждает. Цикл замкнут, только когда оба уверены в понимании.","Joʻnatuvchi uzatadi, qabul qiluvchi takrorlaydi, joʻnatuvchi tasdiqlaydi. Ikkalasi ham tushunilganiga ishonch hosil qilgandagina sikl yopiladi.")),
T("readback","COM","","",L("Read-back / hear-back","Повтор и контроль повтора","Takrorlash va takrorni nazorat qilish"),
 L("The receiver repeats a clearance (read-back); the sender actively checks that the repetition is correct (hear-back). Missed hear-backs are a common source of error.","Получатель повторяет указание (read-back); отправитель активно проверяет правильность повтора (hear-back). Пропущенный контроль повтора — частый источник ошибок.","Qabul qiluvchi koʻrsatmani takrorlaydi (read-back); joʻnatuvchi takror toʻgʻriligini faol tekshiradi (hear-back). Oʻtkazib yuborilgan nazorat — keng tarqalgan xato manbai.")),
T("assert","COM","","",L("Assertiveness","Настойчивость (ассертивность)","Qatʼiyatlilik (assertivlik)"),
 L("Stating your concern clearly and persistently, with respect, until it is resolved — regardless of rank.","Чёткое и настойчивое, но уважительное выражение своей озабоченности до её разрешения — независимо от должности.","Lavozimdan qatʼi nazar, xavotiringizni hal boʻlgunga qadar aniq, qatʼiy va hurmat bilan bildirish.")),
T("pace","COM","PACE","Probe, Alert, Challenge, Emergency",L("PACE escalation","Эскалация PACE","PACE bosqichma-bosqich kuchaytirish"),
 L("Graded assertiveness: Probe (ask a question), Alert (state the concern), Challenge (demand action), Emergency (take control if needed).","Ступенчатая настойчивость: Probe (задать вопрос), Alert (обозначить проблему), Challenge (потребовать действия), Emergency (при необходимости взять управление).","Bosqichli qatʼiyat: Probe (savol berish), Alert (muammoni aytish), Challenge (harakat talab qilish), Emergency (zarur boʻlsa boshqaruvni olish).")),
T("cus","COM","CUS","Concerned, Uncomfortable, Safety issue",L("CUS words","Слова CUS","CUS soʻzlari"),
 L("Escalating key phrases agreed in advance: “I'm concerned”, “I'm uncomfortable”, “This is a safety issue”. Hearing them should stop the action.","Заранее согласованные фразы нарастающей силы: «Я обеспокоен», «Мне некомфортно», «Это угроза безопасности». Услышав их, экипаж останавливает действие.","Oldindan kelishilgan kuchayib boruvchi iboralar: «Men xavotirdaman», «Menga noqulay», «Bu xavfsizlik masalasi». Ularni eshitganda harakat toʻxtatiladi.")),
T("twochal","COM","","",L("Two-challenge rule","Правило двух обращений","Ikki marta ogohlantirish qoidasi"),
 L("If a pilot fails to respond to two clear challenges about a safety-critical deviation, the other pilot may assume incapacitation and take control.","Если пилот не реагирует на два чётких обращения о критическом отклонении, второй пилот может считать его недееспособным и взять управление.","Agar uchuvchi xavfli chetga chiqish haqidagi ikki aniq ogohlantirishga javob bermasa, ikkinchi uchuvchi uni ishga layoqatsiz deb hisoblab, boshqaruvni olishi mumkin.")),
T("briefing","COM","","",L("Briefing","Брифинг","Brifing"),
 L("A short interactive discussion before a flight phase that builds a shared plan, names threats and invites every crew member to speak up.","Короткое интерактивное обсуждение перед этапом полёта: формирует общий план, называет угрозы и приглашает каждого высказываться.","Parvoz bosqichidan oldin qisqa interaktiv muhokama: umumiy reja tuziladi, tahdidlar aytiladi va har bir aʼzo fikr bildirishga taklif qilinadi.")),
T("nits","COM","NITS","Nature, Intentions, Time, Special instructions",L("NITS briefing","Брифинг NITS","NITS brifingi"),
 L("A structure for briefing the cabin crew in a non-normal situation: Nature of the problem, Intentions, Time available, Special instructions.","Структура инструктажа бортпроводников в нештатной ситуации: характер проблемы, намерения, располагаемое время, особые указания.","Nostandart vaziyatda bort kuzatuvchilariga yoʻriqnoma tuzilmasi: muammo turi, niyatlar, mavjud vaqt, maxsus koʻrsatmalar.")),
T("listen","COM","","",L("Active listening","Активное слушание","Faol tinglash"),
 L("Giving full attention, asking clarifying questions and paraphrasing to confirm you understood the speaker.","Полное внимание к собеседнику, уточняющие вопросы и перефразирование для подтверждения понимания.","Soʻzlovchiga toʻliq eʼtibor, aniqlashtiruvchi savollar va tushunganingizni tasdiqlash uchun qayta ifodalash.")),
T("phrase","COM","","",L("Standard phraseology","Стандартная фразеология","Standart frazeologiya"),
 L("Agreed words and formats for radio and crew call-outs that reduce ambiguity, especially between speakers of different languages.","Согласованные слова и формы для радиообмена и докладов экипажа, уменьшающие двусмысленность, особенно между носителями разных языков.","Radio almashinuvi va ekipaj maʼlumotlari uchun kelishilgan soʻz va shakllar; ayniqsa turli tilda soʻzlashuvchilar orasida noaniqlikni kamaytiradi.")),

T("sa","SA","SA","Situation Awareness",L("Situation awareness","Ситуационная осведомлённость","Vaziyatni anglash"),
 L("Knowing what is going on around you and what will happen next. Endsley's model has three levels: perception, comprehension, projection.","Понимание того, что происходит вокруг и что произойдёт дальше. Модель Эндсли включает три уровня: восприятие, понимание, прогнозирование.","Atrofda nima boʻlayotganini va keyin nima boʻlishini bilish. Endsli modelida uch daraja bor: idrok, tushunish, prognoz.")),
T("salevels","SA","","",L("Perception – comprehension – projection","Восприятие – понимание – прогноз","Idrok – tushunish – prognoz"),
 L("Level 1: noticing the cues. Level 2: understanding what they mean. Level 3: predicting the future state. Most SA errors happen at level 1.","Уровень 1: заметить признаки. Уровень 2: понять их смысл. Уровень 3: предсказать будущее состояние. Большинство ошибок — на уровне 1.","1-daraja: belgilarni payqash. 2-daraja: ularning maʼnosini tushunish. 3-daraja: kelajakdagi holatni bashorat qilish. Koʻp xatolar 1-darajada boʻladi.")),
T("redflags","SA","","",L("SA red flags","Признаки потери осведомлённости","Anglash yoʻqolishi belgilari"),
 L("Warning signs: ambiguity, fixation, confusion, unresolved discrepancies, nobody flying the aircraft, deviation from SOPs or targets.","Тревожные признаки: неопределённость, фиксация, растерянность, неразрешённые расхождения, никто не пилотирует, отклонение от SOP или заданных параметров.","Ogohlantiruvchi belgilar: noaniqlik, bir narsaga qotib qolish, sarosima, hal qilinmagan nomuvofiqliklar, hech kim boshqarmayapti, SOP yoki maqsadlardan chetga chiqish.")),
T("tunnel","SA","","",L("Tunnel vision (channelized attention)","Туннельное зрение (сужение внимания)","Tunnel koʻrish (diqqatning torayishi)"),
 L("Focusing on one task or indication so strongly that other important information is missed.","Чрезмерная концентрация на одной задаче или показании, из-за которой упускается другая важная информация.","Bitta vazifa yoki koʻrsatkichga shunchalik berilib ketish, boshqa muhim axborot eʼtibordan chetda qoladi.")),
T("fma","SA","FMA","Flight Mode Annunciator",L("Mode awareness","Осведомлённость о режимах","Rejimlarni anglash"),
 L("Always knowing which autoflight modes are active. Call out and verify every change on the annunciator — mode confusion causes automation surprises.","Постоянное понимание активных режимов автоматики. Каждое изменение на табло режимов озвучивается и проверяется — путаница режимов приводит к «сюрпризам» автоматики.","Qaysi avtoparvoz rejimlari faolligini doim bilish. Rejim tablosidagi har bir oʻzgarishni aytib, tekshirish kerak — rejim chalkashligi avtomatika syurprizlariga olib keladi.")),
T("monitor","SA","","",L("Monitoring and cross-checking","Мониторинг и перекрёстный контроль","Monitoring va oʻzaro nazorat"),
 L("The monitoring pilot actively watches the flight path, systems and the other pilot's actions, and speaks up on any deviation. Weak monitoring appears in most accidents.","Контролирующий пилот активно следит за траекторией, системами и действиями другого пилота и сообщает о любом отклонении. Слабый мониторинг присутствует в большинстве катастроф.","Nazoratchi uchuvchi trayektoriya, tizimlar va boshqa uchuvchi harakatlarini faol kuzatadi va har qanday chetga chiqish haqida aytadi. Zaif monitoring koʻp halokatlarda uchraydi.")),
T("disor","SA","","",L("Spatial disorientation","Пространственная дезориентация","Fazoviy dezoriyentatsiya"),
 L("Misjudging the aircraft's attitude or motion because body senses conflict with reality. Trust the instruments and cross-check.","Неверная оценка положения или движения ВС из-за конфликта ощущений с реальностью. Доверяйте приборам и выполняйте перекрёстный контроль.","Sezgilar haqiqatga zid kelgani sababli havo kemasi holatini notoʻgʻri baholash. Asboblarga ishoning va oʻzaro tekshiring.")),

T("fordec","DM","FORDEC","Facts, Options, Risks & Benefits, Decision, Execution, Check",L("FORDEC decision model","Модель решения FORDEC","FORDEC qaror modeli"),
 L("A structured decision model: Facts, Options, Risks and benefits, Decision, Execution, Check. Widely used by European airlines.","Структурированная модель решения: факты, варианты, риски и выгоды, решение, выполнение, контроль. Широко используется европейскими авиакомпаниями.","Tuzilmali qaror modeli: faktlar, variantlar, xavf va foyda, qaror, bajarish, nazorat. Yevropa aviakompaniyalarida keng qoʻllanadi.")),
T("tdodar","DM","T-DODAR","Time, Diagnose, Options, Decide, Assign, Review",L("T-DODAR decision model","Модель решения T-DODAR","T-DODAR qaror modeli"),
 L("A decision model that starts with the Time available, then Diagnose, Options, Decide, Assign tasks and Review the outcome.","Модель решения, начинающаяся с оценки располагаемого времени: диагностика, варианты, решение, распределение задач, контроль результата.","Mavjud vaqtni baholashdan boshlanadigan qaror modeli: tashxis, variantlar, qaror, vazifalarni taqsimlash, natijani koʻrib chiqish.")),
T("grade","DM","GRADE","Gather, Review, Analyse, Decide, Evaluate",L("GRADE decision model","Модель решения GRADE","GRADE qaror modeli"),
 L("A decision model: Gather information, Review it, Analyse options, Decide, Evaluate the result.","Модель решения: сбор информации, её проверка, анализ вариантов, решение, оценка результата.","Qaror modeli: axborot yigʻish, uni koʻrib chiqish, variantlarni tahlil qilish, qaror, natijani baholash.")),
T("plancont","DM","","",L("Plan continuation bias","Склонность к продолжению плана","Rejani davom ettirishga moyillik"),
 L("The tendency to continue the original plan despite cues that it is no longer safe — often called “get-there-itis”. A common factor in unstable approaches.","Стремление продолжать исходный план вопреки признакам опасности («долететь во что бы то ни стало»). Частый фактор нестабилизированных заходов.","Xavf belgilariga qaramay dastlabki rejani davom ettirish istagi («nima boʻlsa ham yetib borish»). Barqaror boʻlmagan yaqinlashuvlarda koʻp uchraydi.")),
T("confbias","DM","","",L("Confirmation bias","Склонность к подтверждению","Tasdiqlashga moyillik"),
 L("Noticing information that supports what you already believe and ignoring what contradicts it.","Склонность замечать информацию, подтверждающую своё мнение, и игнорировать противоречащую.","Oʻz fikringizni tasdiqlaydigan axborotni payqash va unga zid maʼlumotlarni eʼtiborsiz qoldirish.")),
T("risk","DM","","",L("Risk assessment","Оценка риска","Xavfni baholash"),
 L("Judging the likelihood and severity of a hazard to decide whether the risk is acceptable and which mitigations are needed.","Оценка вероятности и тяжести последствий опасности, чтобы решить, приемлем ли риск и какие меры нужны.","Xavf ehtimoli va oqibat ogʻirligini baholab, risk maqbulmi va qanday choralar kerakligini hal qilish.")),
T("goaround","DM","","",L("Go-around mindset","Готовность к уходу на второй круг","Ikkinchi aylanishga tayyorlik"),
 L("Treating the go-around as a normal, planned outcome of every approach rather than a failure, so the decision is made early.","Восприятие ухода на второй круг как нормального запланированного исхода любого захода, а не как неудачи, чтобы решение принималось рано.","Ikkinchi aylanishni muvaffaqiyatsizlik emas, balki har qanday yaqinlashuvning odatiy rejalashtirilgan natijasi deb bilish; shunda qaror erta qabul qilinadi.")),

T("authgrad","LTW","","",L("Authority gradient","Градиент власти","Hokimiyat gradienti"),
 L("The difference in perceived authority between crew members. Too steep: juniors stay silent. Too flat: no one leads.","Разница в воспринимаемом авторитете членов экипажа. Слишком крутой — младшие молчат; слишком плоский — никто не руководит.","Ekipaj aʼzolari orasidagi seziladigan hokimiyat farqi. Juda tik — kichiklar jim turadi; juda tekis — hech kim boshqarmaydi.")),
T("pfpm","LTW","PF / PM","Pilot Flying / Pilot Monitoring",L("Pilot flying / pilot monitoring","Пилотирующий / контролирующий пилот","Boshqaruvchi / nazoratchi uchuvchi"),
 L("Defined roles: one pilot controls the flight path; the other monitors, handles the radio and checklists and challenges deviations.","Чёткое распределение ролей: один пилот управляет траекторией, другой контролирует, ведёт радиосвязь и чек-листы и указывает на отклонения.","Aniq rollar: bir uchuvchi trayektoriyani boshqaradi; ikkinchisi nazorat qiladi, radio va nazorat roʻyxatlarini yuritadi, chetga chiqishlar haqida aytadi.")),
T("synergy","LTW","","",L("Synergy","Синергия","Sinergiya"),
 L("When a team performs better together than the sum of its members working alone.","Ситуация, когда команда работает эффективнее, чем сумма усилий её членов по отдельности.","Jamoa birgalikda aʼzolar alohida ishlaganidan koʻra samaraliroq ishlaydigan holat.")),
T("mental","LTW","","",L("Shared mental model","Общая ментальная модель","Umumiy aqliy model"),
 L("A common understanding of the situation, the plan and who does what. It is built in briefings and kept current with call-outs.","Общее понимание ситуации, плана и распределения обязанностей. Создаётся на брифингах и поддерживается докладами.","Vaziyat, reja va kim nima qilishi haqida umumiy tushuncha. Brifinglarda shakllanadi va maʼlumotlar bilan yangilanadi.")),
T("follow","LTW","","",L("Followership","Ведомость (followership)","Ergashuvchilik (followership)"),
 L("Active support of the leader: following the plan, monitoring, offering information and speaking up when something is wrong.","Активная поддержка лидера: выполнение плана, контроль, предоставление информации и готовность возразить, если что-то не так.","Yetakchini faol qoʻllab-quvvatlash: rejaga amal qilish, nazorat, axborot berish va biror narsa notoʻgʻri boʻlsa ochiq aytish.")),
T("conflict","LTW","","",L("Conflict resolution","Разрешение конфликтов","Nizolarni hal qilish"),
 L("Focusing on what is right, not who is right: listen, state the facts, find common goals and agree on a safe course of action.","Фокус на том, что правильно, а не кто прав: выслушать, изложить факты, найти общую цель и согласовать безопасные действия.","Kim haq emas, balki nima toʻgʻri ekaniga eʼtibor: tinglash, faktlarni aytish, umumiy maqsad topish va xavfsiz harakatni kelishish.")),
T("cabin","LTW","","",L("Flight deck – cabin coordination","Взаимодействие кабины экипажа и салона","Kokpit va salon hamkorligi"),
 L("Joint briefings and a clear information flow between pilots and cabin crew. Cabin crew are often first to notice smoke, fire or damage.","Совместные брифинги и чёткий обмен информацией между пилотами и бортпроводниками. Бортпроводники часто первыми замечают дым, огонь или повреждения.","Uchuvchilar va bort kuzatuvchilari oʻrtasida qoʻshma brifing va aniq axborot almashinuvi. Tutun, olov yoki shikastni koʻpincha bort kuzatuvchilari birinchi koʻradi.")),

T("wlm","WLM","","",L("Workload management","Управление рабочей нагрузкой","Ish yukini boshqarish"),
 L("Planning, prioritising and sharing tasks so that no crew member is overloaded or underloaded. Prepare for high-workload phases in advance.","Планирование, расстановка приоритетов и распределение задач так, чтобы никто не был перегружен или недогружен. К этапам высокой нагрузки готовятся заранее.","Vazifalarni rejalashtirish, ustuvorlashtirish va taqsimlash, shunda hech kim haddan ortiq yoki kam yuklanmaydi. Yuqori yuklama bosqichlariga oldindan tayyorlaniladi.")),
T("ana","WLM","","",L("Aviate – Navigate – Communicate","Пилотируй – навигируй – связывайся","Boshqar – yoʻnaltir – aloqa qil"),
 L("The basic priority order: first fly the aircraft, then control where it goes, then talk to ATC and the crew.","Базовый порядок приоритетов: сначала пилотировать, затем контролировать навигацию, затем вести связь с УВД и экипажем.","Asosiy ustuvorlik tartibi: avval havo kemasini boshqarish, keyin yoʻnalishni nazorat qilish, soʻngra HHB va ekipaj bilan aloqa.")),
T("sterile","WLM","","",L("Sterile flight deck","«Стерильная» кабина","«Steril» kokpit"),
 L("Below 10,000 ft and during taxi, take-off and approach, only safety-related talk and activity are allowed in the flight deck.","Ниже 10 000 футов, а также при рулении, взлёте и заходе в кабине допускаются только разговоры и действия, связанные с безопасностью.","10 000 futdan past hamda rulyojka, uchish va yaqinlashishda kokpitda faqat xavfsizlik bilan bogʻliq gap va harakatlarga ruxsat beriladi.")),
T("saturation","WLM","","",L("Task saturation","Перегрузка задачами","Vazifalar bilan haddan ortiq yuklanish"),
 L("More tasks than the crew can handle at once. Signs: missed calls, rushed checklists, tunnel vision. Remedy: prioritise, delegate, buy time.","Задач больше, чем экипаж способен выполнить одновременно. Признаки: пропущенные доклады, спешка с чек-листами, туннельное зрение. Решение: приоритеты, делегирование, выигрыш времени.","Ekipaj bir vaqtda bajara oladiganidan koʻp vazifa. Belgilari: oʻtkazib yuborilgan maʼlumotlar, shoshilinch nazorat roʻyxatlari, tunnel koʻrish. Yechim: ustuvorlik, topshirish, vaqt yutish.")),
T("auto","WLM","","",L("Automation management","Управление автоматикой","Avtomatikani boshqarish"),
 L("Choosing the level of automation that fits the situation. If the automation does not do what you expect, step down to a lower level.","Выбор уровня автоматизации, соответствующего ситуации. Если автоматика ведёт себя неожиданно — перейдите на более низкий уровень.","Vaziyatga mos avtomatlashtirish darajasini tanlash. Agar avtomatika kutilmagan ish qilsa, pastroq darajaga oʻting.")),
T("startle","WLM","","",L("Startle and surprise","Испуг и неожиданность","Choʻchish va kutilmaganlik"),
 L("Sudden events trigger a startle reflex and surprise that impair thinking for several seconds. Counter it: fly the aircraft first, then analyse.","Внезапное событие вызывает рефлекс испуга и удивление, нарушающие мышление на несколько секунд. Противодействие: сначала пилотировать, потом анализировать.","Toʻsatdan sodir boʻlgan voqea choʻchish refleksi va hayratni keltirib chiqaradi, bir necha soniya fikrlashni buzadi. Chora: avval boshqarish, keyin tahlil qilish.")),
T("deleg","WLM","","",L("Delegation and task sharing","Делегирование и распределение задач","Vazifalarni topshirish va taqsimlash"),
 L("Assigning tasks clearly (who, what, when) so the captain keeps capacity to manage the overall situation.","Чёткое поручение задач (кто, что, когда), чтобы командир сохранял ресурс для управления ситуацией в целом.","Vazifalarni aniq topshirish (kim, nima, qachon), shunda kapitan umumiy vaziyatni boshqarish uchun imkoniyatni saqlaydi.")),

T("tem","TEM","TEM","Threat and Error Management",L("Threat and error management","Управление угрозами и ошибками","Tahdid va xatolarni boshqarish"),
 L("A framework that treats threats and errors as a normal part of flying and focuses on anticipating, detecting and managing them before they lead to an undesired aircraft state.","Подход, рассматривающий угрозы и ошибки как часть полётов и нацеленный на их предвидение, обнаружение и устранение до возникновения нежелательного состояния ВС.","Tahdid va xatolarni parvozning odatiy qismi deb biladigan va ularni nomaqbul holatga olib kelmasdan oldin oldindan koʻrish, aniqlash va boshqarishga qaratilgan yondashuv.")),
T("threat","TEM","","",L("Threat","Угроза","Tahdid"),
 L("An event or error outside the crew's influence that increases complexity: weather, terrain, ATC, aircraft defects, other crews. It can be expected, unexpected or latent.","Событие или ошибка вне влияния экипажа, повышающая сложность: погода, рельеф, УВД, неисправности, другие экипажи. Бывают ожидаемыми, неожиданными и скрытыми.","Ekipaj taʼsiridan tashqaridagi, murakkablikni oshiradigan voqea yoki xato: ob-havo, relyef, HHB, nosozlik, boshqa ekipajlar. Kutilgan, kutilmagan yoki yashirin boʻladi.")),
T("error","TEM","","",L("Crew error","Ошибка экипажа","Ekipaj xatosi"),
 L("An action or inaction by the crew that leads to a deviation from intentions or expectations. Types: aircraft handling, procedural, communication.","Действие или бездействие экипажа, ведущее к отклонению от намерений или ожиданий. Виды: пилотирование, процедурные, коммуникационные.","Ekipajning niyat yoki kutilgan natijadan chetga chiqishga olib keladigan harakati yoki harakatsizligi. Turlari: boshqaruv, tartib, muloqot xatolari.")),
T("uas","TEM","UAS","Undesired Aircraft State",L("Undesired aircraft state","Нежелательное состояние ВС","Nomaqbul havo kemasi holati"),
 L("A position, speed, attitude or configuration caused by crew error that reduces safety margins, such as an unstable approach or the wrong taxiway.","Положение, скорость, пространственное положение или конфигурация, вызванные ошибкой экипажа и снижающие запас безопасности, например нестабилизированный заход или не та рулёжная дорожка.","Ekipaj xatosi natijasida xavfsizlik zaxirasini kamaytiradigan holat, tezlik, fazoviy holat yoki konfiguratsiya, masalan barqaror boʻlmagan yaqinlashuv yoki notoʻgʻri rulyojka yoʻlagi.")),
T("counter","TEM","","",L("Countermeasures","Контрмеры","Qarshi choralar"),
 L("Crew actions that prevent or manage threats and errors: briefings, planning, monitoring, cross-checks, call-outs, workload and automation management.","Действия экипажа, предотвращающие угрозы и ошибки или управляющие ими: брифинги, планирование, мониторинг, перекрёстный контроль, доклады, управление нагрузкой и автоматикой.","Tahdid va xatolarning oldini oladigan yoki ularni boshqaradigan ekipaj harakatlari: brifing, rejalashtirish, monitoring, oʻzaro nazorat, maʼlumotlar, yuk va avtomatikani boshqarish.")),
T("stable","TEM","","",L("Stabilized approach","Стабилизированный заход","Barqaror yaqinlashuv"),
 L("By a set gate (typically 1,000 ft IMC / 500 ft VMC) the aircraft is on path, configured, at target speed and thrust. If not, go around.","К заданному рубежу (обычно 1000 футов в ПМУ / 500 футов в ВМУ) ВС на траектории, в посадочной конфигурации, на заданной скорости и режиме. Если нет — уход на второй круг.","Belgilangan chegaraga (odatda IMC da 1000 fut / VMC da 500 fut) havo kemasi trayektoriyada, qoʻnish konfiguratsiyasida, belgilangan tezlik va rejimda boʻlishi kerak. Aks holda — ikkinchi aylanish.")),
T("chain","TEM","","",L("Error chain","Цепочка ошибок","Xatolar zanjiri"),
 L("Accidents rarely have a single cause; they follow a series of linked events. Breaking any link prevents the outcome.","Происшествия редко имеют одну причину: это последовательность связанных событий. Разрыв любого звена предотвращает исход.","Hodisalar kamdan-kam bitta sababga ega: bu bogʻliq voqealar ketma-ketligi. Istalgan halqani uzish natijaning oldini oladi."))
];

/* Scenario traps — the reasoning pattern behind each wrong answer */
const TRAPS={
PASSIVE:{n:L("Staying silent or waiting","Молчание или ожидание","Jim turish yoki kutish"),
 r:L("You often choose to stay silent or wait. Practise speaking up with PACE and CUS words — raising a safety concern is your duty.","Вы часто выбираете молчание или ожидание. Тренируйте настойчивость с помощью PACE и слов CUS — высказать опасение о безопасности — ваша обязанность.","Siz koʻpincha jim turish yoki kutishni tanlaysiz. PACE va CUS soʻzlari bilan qatʼiyatni mashq qiling — xavfsizlik muammosi haqida aytish burchingiz.")},
HASTY:{n:L("Acting before analysing","Действие без анализа","Tahlilsiz harakat"),
 r:L("You tend to act before analysing. Use a decision model (FORDEC or T-DODAR) and remember: fly first, then think, then act.","Вы склонны действовать до анализа. Используйте модель решения (FORDEC или T-DODAR) и помните: сначала пилотируй, затем думай, затем действуй.","Siz tahlildan oldin harakat qilishga moyilsiz. Qaror modelidan (FORDEC yoki T-DODAR) foydalaning: avval boshqar, keyin oʻyla, soʻng harakat qil.")},
SOLO:{n:L("Acting alone","Действия в одиночку","Yakka harakat"),
 r:L("You often fix things without telling the crew. Say what you see and what you do, so the shared mental model stays intact.","Вы часто исправляете что-то, не сообщая экипажу. Говорите, что видите и что делаете, — так сохраняется общая ментальная модель.","Siz koʻpincha ekipajga aytmay tuzatasiz. Nima koʻrayotganingiz va nima qilayotganingizni ayting — shunda umumiy aqliy model saqlanadi.")},
FIXATION:{n:L("Plan continuation or fixation","Продолжение плана или фиксация","Rejani davom ettirish yoki qotib qolish"),
 r:L("You tend to continue the plan despite warning signs. Set decision gates in advance and treat a go-around or diversion as normal.","Вы склонны продолжать план вопреки тревожным признакам. Заранее устанавливайте рубежи решений и считайте уход на второй круг или на запасной нормой.","Siz xavf belgilariga qaramay rejani davom ettirishga moyilsiz. Qaror chegaralarini oldindan belgilang va ikkinchi aylanish yoki zaxira aerodromni odatiy hol deb biling.")},
NONSOP:{n:L("Bypassing procedures","Обход процедур","Tartiblarni chetlab oʻtish"),
 r:L("Several of your choices bypass procedures. Revisit sterile flight deck, briefing and checklist rules — SOPs are the crew's shared language.","Часть ваших ответов обходит процедуры. Повторите правила «стерильной» кабины, брифингов и чек-листов — SOP являются общим языком экипажа.","Javoblaringizning bir qismi tartiblarni chetlab oʻtadi. «Steril» kokpit, brifing va nazorat roʻyxatlari qoidalarini takrorlang — SOP ekipajning umumiy tili.")},
OVERCONF:{n:L("Overconfidence","Самоуверенность","Haddan ortiq ishonch"),
 r:L("Some answers show overconfidence or complacency. Review hazardous attitudes and IMSAFE — know your limits.","Некоторые ответы показывают самоуверенность или самоуспокоенность. Повторите опасные установки и IMSAFE — знайте свои пределы.","Baʼzi javoblar haddan ortiq ishonch yoki xotirjamlikni koʻrsatadi. Xavfli munosabatlar va IMSAFE ni takrorlang — oʻz chegaralaringizni biling.")}
};

/* Situational judgement scenarios: first option written is the best one; options are shuffled on display */
const O=(t,tr)=>({t,tr:tr||null,ok:!tr});
const SCN=[
{id:"s1",a:"COM",s:L("On descent ATC clears you to FL120. The captain (pilot flying) reads back “FL100” and sets 10,000 ft. ATC does not correct the read-back. You are the monitoring pilot.","На снижении УВД даёт эшелон 120. Командир (пилотирующий) повторяет «эшелон 100» и устанавливает 10 000 футов. УВД не исправляет. Вы — контролирующий пилот.","Pasayishda HHB FL120 ga ruxsat beradi. Kapitan (boshqaruvchi uchuvchi) «FL100» deb takrorlaydi va 10 000 futni oʻrnatadi. HHB tuzatmaydi. Siz — nazoratchi uchuvchisiz."),
 o:[O(L("Point out the discrepancy and ask ATC to confirm the cleared level.","Указать на расхождение и запросить у УВД подтверждение эшелона.","Nomuvofiqlikni aytish va HHB dan ruxsat etilgan eshelonni tasdiqlashni soʻrash.")),
    O(L("Say nothing — ATC didn't object, so it must be right.","Промолчать — УВД не возразил, значит, всё верно.","Indamaslik — HHB eʼtiroz bildirmadi, demak toʻgʻri."),"PASSIVE"),
    O(L("Quietly reset the altitude selector to FL120 yourself.","Молча переставить задатчик высоты на эшелон 120.","Indamay balandlik tanlagichini FL120 ga oʻzgartirish."),"SOLO"),
    O(L("Wait and see whether ATC queries it later.","Подождать — вдруг УВД сам переспросит.","Kutish — balki HHB keyin oʻzi soʻrar."),"PASSIVE")],
 e:L("A missed hear-back by ATC does not make a wrong read-back right. Speak up and verify with ATC — that closes the communication loop and keeps both pilots' mental model aligned.","Пропущенный диспетчером контроль повтора не делает ошибочный повтор правильным. Скажите о расхождении и уточните у УВД — так замыкается цикл связи и сохраняется общая модель ситуации у обоих пилотов.","Dispetcher takrorni nazorat qilmagani notoʻgʻri takrorni toʻgʻri qilmaydi. Nomuvofiqlikni aytib, HHB bilan aniqlang — shunda aloqa sikli yopiladi va ikkala uchuvchining umumiy tasavvuri saqlanadi.")},
{id:"s2",a:"COM",s:L("On a gusty final the speed is 10 kt below target. You called “Speed” once; the captain said “checking”, but nothing changed.","На посадочной прямой при порывистом ветре скорость на 10 узлов ниже заданной. Вы один раз доложили «Скорость», командир ответил «проверяю», но ничего не изменилось.","Shamol esayotgan qoʻnish toʻgʻri chizigʻida tezlik belgilangandan 10 uzel past. Siz bir marta «Tezlik» dedingiz, kapitan «tekshiryapman» dedi, lekin hech narsa oʻzgarmadi."),
 o:[O(L("Challenge with specifics: “Speed minus 10 — increase thrust now!”","Потребовать конкретно: «Скорость минус 10 — увеличь режим!»","Aniq talab qilish: «Tezlik minus 10 — rejimni oshir!»")),
    O(L("Stay quiet — the captain acknowledged.","Промолчать — командир ведь ответил.","Jim turish — kapitan javob berdi-ku."),"PASSIVE"),
    O(L("Take control immediately without another word.","Сразу взять управление без дальнейших слов.","Boshqa soʻzsiz darhol boshqaruvni olish."),"HASTY"),
    O(L("Mention it in the debrief after landing.","Обсудить это на разборе после посадки.","Qoʻngandan keyin debrifingda aytish."),"PASSIVE")],
 e:L("Use graded assertiveness (PACE): when a probe or alert has no effect, challenge with the deviation and the action required. Taking control is the last step — the two-challenge rule applies if there is still no response.","Используйте ступенчатую настойчивость (PACE): если вопрос или предупреждение не подействовали, потребуйте действие, назвав отклонение. Взятие управления — последний шаг; если ответа по-прежнему нет, действует правило двух обращений.","Bosqichli qatʼiyatdan (PACE) foydalaning: savol yoki ogohlantirish taʼsir qilmasa, chetga chiqishni aytib, harakat talab qiling. Boshqaruvni olish — oxirgi qadam; javob boʻlmasa, ikki marta ogohlantirish qoidasi qoʻllanadi.")},
{id:"s3",a:"SA",s:L("In cruise both pilots are working a minor pressurisation fault. Unnoticed, the NAV mode has disengaged and the aircraft is drifting off track.","В крейсерском полёте оба пилота заняты небольшим отказом системы наддува. Незаметно режим NAV отключился, и самолёт уходит с линии пути.","Kruiz parvozida ikkala uchuvchi bosim tizimidagi kichik nosozlik bilan band. Sezilmagan holda NAV rejimi oʻchib, samolyot yoʻnalishdan chetga chiqmoqda."),
 o:[O(L("Assign one pilot to fly and monitor the flight path while the other works the fault.","Назначить одного пилота пилотировать и следить за траекторией, а второго — работать с отказом.","Bir uchuvchini boshqarish va trayektoriyani kuzatishga, ikkinchisini nosozlik bilan ishlashga tayinlash.")),
    O(L("Both keep troubleshooting — a small drift can wait.","Оба продолжают разбираться с отказом — небольшое отклонение подождёт.","Ikkalasi nosozlik bilan shugʻullanishda davom etadi — kichik chetlanish kutib turadi."),"FIXATION"),
    O(L("Ask a cabin crew member to sit in the flight deck and watch the instruments.","Попросить бортпроводника посидеть в кабине и следить за приборами.","Bort kuzatuvchisidan kokpitda oʻtirib asboblarni kuzatishni soʻrash."),"NONSOP"),
    O(L("Disconnect the autopilot and hand-fly while still troubleshooting.","Отключить автопилот и пилотировать вручную, продолжая разбираться с отказом.","Avtopilotni oʻchirib, nosozlik bilan shugʻullangan holda qoʻlda boshqarish."),"HASTY")],
 e:L("When both pilots focus on one problem, nobody flies the aircraft — a classic SA red flag. Split the roles: one flies and monitors, the other manages the fault.","Когда оба пилота заняты одной проблемой, самолётом никто не управляет — классический признак потери осведомлённости. Разделите роли: один пилотирует и контролирует, второй работает с отказом.","Ikkala uchuvchi bitta muammo bilan band boʻlsa, havo kemasini hech kim boshqarmaydi — anglash yoʻqolishining klassik belgisi. Rollarni ajrating: biri boshqaradi va kuzatadi, ikkinchisi nosozlik bilan ishlaydi.")},
{id:"s4",a:"SA",s:L("On a night ILS approach the mode annunciator shows V/S instead of the expected G/S. The pilot flying has not noticed.","Ночью при заходе по ILS на табло режимов отображается V/S вместо ожидаемого G/S. Пилотирующий пилот этого не заметил.","Tunda ILS boʻyicha yaqinlashishda rejim tablosida kutilgan G/S oʻrniga V/S koʻrsatilmoqda. Boshqaruvchi uchuvchi buni payqamagan."),
 o:[O(L("Call out “FMA: V/S, not G/S” and confirm the intended mode with the pilot flying.","Доложить «FMA: V/S, не G/S» и согласовать с пилотирующим нужный режим.","«FMA: V/S, G/S emas» deb aytish va boshqaruvchi uchuvchi bilan kerakli rejimni kelishish.")),
    O(L("Assume the glideslope will capture soon.","Считать, что глиссада скоро захватится.","Glissada tez orada ushlanadi deb hisoblash."),"FIXATION"),
    O(L("Re-arm approach mode yourself without saying anything.","Самому включить режим захода, ничего не говоря.","Hech narsa demasdan yaqinlashish rejimini oʻzingiz yoqish."),"SOLO"),
    O(L("Wait until 1,000 ft to see if it corrects itself.","Подождать до 1000 футов — может, исправится само.","1000 futgacha kutish — balki oʻzi tuzalar."),"PASSIVE")],
 e:L("Mode awareness means calling out and verifying every annunciator change. Saying it aloud keeps both pilots in the loop; silent fixes break the shared mental model.","Осведомлённость о режимах — это озвучивание и проверка каждого изменения на табло. Доклад вслух держит обоих пилотов в курсе; молчаливое исправление разрушает общую модель.","Rejimlarni anglash — tablodagi har bir oʻzgarishni ovoz chiqarib aytish va tekshirish. Ovoz chiqarib aytish ikkala uchuvchini xabardor qiladi; indamay tuzatish umumiy tasavvurni buzadi.")},
{id:"s5",a:"DM",s:L("Forty minutes from destination the weather drops below minima. Fuel allows one approach plus diversion. The captain wants to “have a look anyway”.","За 40 минут до аэродрома назначения погода становится ниже минимума. Топлива хватает на один заход и уход на запасной. Командир хочет «всё равно посмотреть».","Manzil aeroportiga 40 daqiqa qolganda ob-havo minimumdan pastga tushadi. Yoqilgʻi bitta yaqinlashuv va zaxira aerodromga ketishga yetadi. Kapitan «baribir bir koʻramiz» demoqchi."),
 o:[O(L("Work it through with a model such as FORDEC: facts, options including the alternate, risks — then decide together.","Разобрать ситуацию по модели, например FORDEC: факты, варианты (включая запасной), риски — и принять решение вместе.","Vaziyatni FORDEC kabi model boʻyicha tahlil qilish: faktlar, variantlar (zaxira aerodrom ham), xavflar — va birga qaror qabul qilish.")),
    O(L("Continue — the weather often improves on arrival.","Продолжать — погода часто улучшается к прилёту.","Davom etish — ob-havo koʻpincha yetib kelganda yaxshilanadi."),"FIXATION"),
    O(L("Divert at once without reviewing options or briefing the crew.","Немедленно уйти на запасной без анализа вариантов и брифинга.","Variantlarni koʻrib chiqmasdan va brifingsiz darhol zaxira aerodromga ketish."),"HASTY"),
    O(L("Let ATC decide for you.","Пусть решает УВД.","Qarorni HHB ga qoldirish."),"PASSIVE")],
 e:L("“Having a look” below minima is plan continuation bias. A structured model makes you list options and risks while there is still time and fuel.","«Посмотреть» ниже минимума — это склонность к продолжению плана. Структурированная модель заставляет перечислить варианты и риски, пока есть время и топливо.","Minimumdan past holatda «bir koʻrish» — rejani davom ettirishga moyillik. Tuzilmali model vaqt va yoqilgʻi bor ekan variantlar va xavflarni sanab chiqishga majbur qiladi.")},
{id:"s6",a:"DM",s:L("Shortly after take-off a HYD B LO PRESS caution appears. The aircraft is flying normally and there is no immediate danger.","Вскоре после взлёта появляется предупреждение HYD B LO PRESS. Самолёт управляется нормально, непосредственной опасности нет.","Uchgandan soʻng koʻp oʻtmay HYD B LO PRESS ogohlantirishi chiqadi. Samolyot normal boshqarilmoqda, bevosita xavf yoʻq."),
 o:[O(L("Fly the aircraft, run the checklist, then use T-DODAR: time, diagnose, options, decide, assign, review.","Пилотировать, выполнить чек-лист, затем T-DODAR: время, диагноз, варианты, решение, распределение, контроль.","Boshqarish, nazorat roʻyxatini bajarish, soʻng T-DODAR: vaqt, tashxis, variantlar, qaror, taqsimlash, koʻrib chiqish.")),
    O(L("Turn back and land overweight immediately, before running the checklist.","Немедленно развернуться и сесть с превышением посадочной массы, не выполнив чек-лист.","Nazorat roʻyxatini bajarmay, darhol qaytib, ortiqcha vazn bilan qoʻnish."),"HASTY"),
    O(L("Continue to destination without further analysis.","Продолжать полёт до пункта назначения без дальнейшего анализа.","Qoʻshimcha tahlilsiz manzilga davom etish."),"FIXATION"),
    O(L("Call maintenance control and wait for them to decide.","Связаться с инженерной службой и ждать их решения.","Texnik xizmat bilan bogʻlanib, ularning qarorini kutish."),"PASSIVE")],
 e:L("With no time pressure, there is time to do it right: aviate first, then run the checklist and decide with a structured model. Outside resources help, but the crew owns the decision.","Без дефицита времени можно действовать правильно: сначала пилотирование, затем чек-лист и решение по структурированной модели. Внешние ресурсы полезны, но решение принимает экипаж.","Vaqt bosimi boʻlmasa, toʻgʻri harakat qilish mumkin: avval boshqarish, keyin nazorat roʻyxati va tuzilmali model boʻyicha qaror. Tashqi resurslar foydali, lekin qarorni ekipaj qabul qiladi.")},
{id:"s7",a:"LTW",s:L("You are a new first officer. In the briefing the captain says: “I've flown this route 500 times, just follow me.” Later you see he has not set the missed-approach altitude.","Вы — новый второй пилот. На брифинге командир говорит: «Я летал по этому маршруту 500 раз, просто следуй за мной». Позже вы видите, что он не установил высоту ухода на второй круг.","Siz yangi ikkinchi uchuvchisiz. Brifingda kapitan: «Bu yoʻnalishda 500 marta uchganman, menga ergash», deydi. Keyinroq u ikkinchi aylanish balandligini oʻrnatmaganini koʻrasiz."),
 o:[O(L("Say clearly: “Captain, missed-approach altitude is not set.”","Чётко сказать: «Командир, высота ухода на второй круг не установлена».","Aniq aytish: «Kapitan, ikkinchi aylanish balandligi oʻrnatilmagan».")),
    O(L("Say nothing to avoid embarrassing him.","Промолчать, чтобы не ставить его в неловкое положение.","Uni noqulay ahvolga solmaslik uchun indamaslik."),"PASSIVE"),
    O(L("Set it yourself without telling him.","Установить самому, не сообщая ему.","Unga aytmasdan oʻzingiz oʻrnatish."),"SOLO"),
    O(L("Report him to the company after the flight instead.","Вместо этого доложить о нём в компанию после рейса.","Buning oʻrniga reysdan keyin kompaniyaga xabar berish."),"PASSIVE")],
 e:L("A steep authority gradient makes juniors stay silent. As monitoring pilot your job is to speak up — clearly, respectfully and at once, whatever the captain's experience.","Крутой градиент власти заставляет младших молчать. Ваша задача как контролирующего пилота — сказать: чётко, уважительно и сразу, независимо от опыта командира.","Tik hokimiyat gradienti kichiklarni jim turishga majbur qiladi. Nazoratchi uchuvchi sifatida vazifangiz — aniq, hurmat bilan va darhol aytish, kapitan tajribasidan qatʼi nazar.")},
{id:"s8",a:"LTW",s:L("The purser calls: a passenger smells something burning near row 23. The captain is busy talking to ATC.","Старший бортпроводник сообщает: пассажир чувствует запах гари в районе 23-го ряда. Командир занят радиообменом с УВД.","Katta bort kuzatuvchisi xabar beradi: 23-qator yonida yoʻlovchi kuygan hidini sezmoqda. Kapitan HHB bilan gaplashish bilan band."),
 o:[O(L("Take the details, inform the captain within seconds, and agree actions as a crew, with a NITS briefing for the cabin.","Уточнить детали, в течение нескольких секунд сообщить командиру и согласовать действия экипажем, проведя NITS-брифинг для салона.","Tafsilotlarni aniqlash, bir necha soniyada kapitanga xabar berish va ekipaj boʻlib harakatlarni kelishish, salon uchun NITS brifingi bilan.")),
    O(L("Ask the purser to call back later — the flight deck is busy.","Попросить перезвонить позже — в кабине сейчас много работы.","Keyinroq qoʻngʻiroq qilishni soʻrash — kokpit hozir band."),"FIXATION"),
    O(L("Act only if visible smoke appears.","Действовать, только если появится видимый дым.","Faqat koʻrinadigan tutun paydo boʻlsagina harakat qilish."),"PASSIVE"),
    O(L("Leave the flight deck to check personally.","Покинуть кабину, чтобы проверить лично.","Shaxsan tekshirish uchun kokpitni tark etish."),"NONSOP")],
 e:L("Cabin crew are often first to detect smoke or fire. Treat the report as urgent, keep the captain informed and brief the cabin with NITS.","Бортпроводники часто первыми обнаруживают дым или огонь. Отнеситесь к сообщению как к срочному, держите командира в курсе и проинструктируйте салон по NITS.","Tutun yoki olovni koʻpincha bort kuzatuvchilari birinchi aniqlaydi. Xabarni shoshilinch deb qabul qiling, kapitanni xabardor qiling va salonni NITS boʻyicha yoʻriqlang.")},
{id:"s9",a:"WLM",s:L("At 12 NM from a busy airport ATC changes your landing runway. The briefing, FMS and checklists all need redoing.","За 12 миль до загруженного аэропорта УВД меняет посадочную полосу. Нужно заново провести брифинг, перепрограммировать FMS и выполнить чек-листы.","Gavjum aeroportga 12 mil qolganda HHB qoʻnish yoʻlagini oʻzgartiradi. Brifing, FMS va nazorat roʻyxatlarini qaytadan bajarish kerak."),
 o:[O(L("Ask ATC for extra track miles or vectors to buy time, then re-brief.","Запросить у УВД дополнительный путь или векторение, чтобы выиграть время, затем повторить брифинг.","Vaqt yutish uchun HHB dan qoʻshimcha masofa yoki vektor soʻrash, soʻng qayta brifing qilish.")),
    O(L("Accept and rush everything to keep the slot.","Согласиться и всё сделать в спешке, чтобы не потерять очередь.","Rozi boʻlib, navbatni yoʻqotmaslik uchun hammasini shoshilib bajarish."),"HASTY"),
    O(L("The pilot flying reprograms the FMS alone while also flying.","Пилотирующий сам перепрограммирует FMS, одновременно пилотируя.","Boshqaruvchi uchuvchi boshqarish bilan birga FMS ni oʻzi qayta dasturlaydi."),"SOLO"),
    O(L("Skip the briefing for the new runway.","Пропустить брифинг на новую полосу.","Yangi yoʻlak uchun brifingni oʻtkazib yuborish."),"NONSOP")],
 e:L("When workload exceeds the time available, change the time, not the quality: request vectors or a hold, share tasks between the pilots and brief the new plan.","Когда нагрузка превышает располагаемое время, меняйте время, а не качество: запросите векторение или зону ожидания, распределите задачи между пилотами и проведите брифинг нового плана.","Ish yuki mavjud vaqtdan oshsa, sifatni emas, vaqtni oʻzgartiring: vektor yoki kutish zonasini soʻrang, vazifalarni uchuvchilar oʻrtasida taqsimlang va yangi rejani brifing qiling.")},
{id:"s10",a:"WLM",s:L("Descending through 8,000 ft, the first officer starts a long conversation about next month's roster.","На снижении, проходя 8000 футов, второй пилот начинает долгий разговор о графике на следующий месяц.","8000 futdan pasayayotganda ikkinchi uchuvchi kelasi oy jadvali haqida uzoq suhbat boshlaydi."),
 o:[O(L("Politely postpone it: sterile flight deck until on stand.","Вежливо отложить разговор: «стерильная» кабина до стоянки.","Suhbatni xushmuomalalik bilan keyinga qoldirish: toʻxtash joyigacha «steril» kokpit.")),
    O(L("Join in — workload is low tonight.","Поддержать разговор — сегодня нагрузка невелика.","Suhbatga qoʻshilish — bugun ish yuki kam."),"NONSOP"),
    O(L("Let the first officer talk while you run the approach checklist alone.","Пусть второй пилот говорит, а вы сами выполните чек-лист захода.","Ikkinchi uchuvchi gapiraversin, yaqinlashish nazorat roʻyxatini oʻzingiz bajaring."),"SOLO"),
    O(L("Say nothing and stop listening.","Промолчать и перестать слушать.","Indamay, tinglashni toʻxtatish."),"PASSIVE")],
 e:L("Below 10,000 ft only safety-related talk belongs in the flight deck. Many approach errors start with distraction during low-workload phases.","Ниже 10 000 футов в кабине уместны только разговоры о безопасности. Многие ошибки на заходе начинаются с отвлечения на этапах низкой нагрузки.","10 000 futdan past kokpitda faqat xavfsizlikka oid suhbat oʻrinli. Yaqinlashishdagi koʻp xatolar past yuklama bosqichlarida chalgʻishdan boshlanadi.")},
{id:"s11",a:"TEM",s:L("Briefing for a mountain airport: 8 kt tailwind, a short runway, a newly qualified first officer and a NOTAM about GPS outages.","Брифинг перед горным аэродромом: попутный ветер 8 узлов, короткая полоса, недавно допущенный второй пилот и NOTAM о сбоях GPS.","Togʻli aerodromga brifing: 8 uzel quyruq shamoli, qisqa yoʻlak, yaqinda ruxsat olgan ikkinchi uchuvchi va GPS uzilishlari haqida NOTAM."),
 o:[O(L("Name each threat and agree a countermeasure for it: landing performance check, stabilization gate, raw-data monitoring.","Назвать каждую угрозу и согласовать контрмеру: расчёт посадочных характеристик, рубеж стабилизации, контроль по «сырым» данным.","Har bir tahdidni aytib, unga qarshi chorani kelishish: qoʻnish tavsiflarini hisoblash, barqarorlik chegarasi, xom maʼlumotlar boʻyicha nazorat.")),
    O(L("Brief the standard items only; deal with threats if they appear.","Провести только стандартный брифинг; с угрозами разбираться по мере появления.","Faqat standart brifing; tahdidlar paydo boʻlsa, ular bilan shugʻullanish."),"PASSIVE"),
    O(L("Give the new first officer the landing to build experience, without discussing the threats.","Отдать посадку новому второму пилоту для опыта, не обсуждая угрозы.","Tahdidlarni muhokama qilmay, tajriba uchun qoʻnishni yangi ikkinchi uchuvchiga berish."),"HASTY"),
    O(L("Mention only the tailwind — the GPS NOTAM doesn't matter on an ILS.","Упомянуть только попутный ветер — NOTAM о GPS не важен при заходе по ILS.","Faqat quyruq shamolini aytish — ILS da GPS NOTAM ahamiyatsiz."),"FIXATION")],
 e:L("TEM starts in the briefing: anticipate expected and latent threats and plan countermeasures before they combine. Threats rarely come alone.","TEM начинается с брифинга: предвидеть ожидаемые и скрытые угрозы и спланировать контрмеры до того, как они наложатся друг на друга. Угрозы редко приходят поодиночке.","TEM brifingdan boshlanadi: kutilgan va yashirin tahdidlarni oldindan koʻrish va ular birlashmasidan oldin qarshi choralarni rejalashtirish. Tahdidlar kamdan-kam yolgʻiz keladi.")},
{id:"s12",a:"TEM",s:L("At 500 ft on a visual approach you are 15 kt fast and not yet in landing configuration. The company stabilization gate is 500 ft VMC.","На визуальном заходе на высоте 500 футов скорость на 15 узлов выше, посадочная конфигурация не выпущена. Рубеж стабилизации компании — 500 футов в ВМУ.","Vizual yaqinlashuvda 500 fut balandlikda tezlik 15 uzel ortiq, qoʻnish konfiguratsiyasi hali chiqarilmagan. Kompaniyaning barqarorlik chegarasi — VMC da 500 fut."),
 o:[O(L("Call “Unstable — go around” and fly the go-around.","Доложить «Нестабилизирован — уход на второй круг» и выполнить уход.","«Barqaror emas — ikkinchi aylanish» deb aytish va ikkinchi aylanishni bajarish.")),
    O(L("Continue — the runway is long enough.","Продолжать — полоса достаточно длинная.","Davom etish — yoʻlak yetarlicha uzun."),"FIXATION"),
    O(L("Pull thrust to idle and extend flaps fast to fix it below 500 ft.","Убрать режим до малого газа и быстро выпустить закрылки, чтобы исправить ниже 500 футов.","Rejimni kichik gazga tushirib, 500 futdan past tuzatish uchun qanotchalarni tez chiqarish."),"HASTY"),
    O(L("Land and file a report afterwards.","Сесть и потом написать отчёт.","Qoʻnib, keyin hisobot yozish."),"NONSOP")],
 e:L("An unstable approach at the gate is an undesired aircraft state. The go-around is the planned countermeasure; continuing can turn it into a runway excursion.","Нестабилизированный заход на рубеже — нежелательное состояние ВС. Уход на второй круг — запланированная контрмера; продолжение может привести к выкатыванию за пределы ВПП.","Chegarada barqaror boʻlmagan yaqinlashuv — nomaqbul havo kemasi holati. Ikkinchi aylanish — rejalashtirilgan qarshi chora; davom ettirish yoʻlakdan chiqib ketishga olib kelishi mumkin.")},
{id:"s13",a:"HF",s:L("A hotel fire alarm cut your sleep to 4 hours. Report time is in 2 hours for a three-sector day.","Из-за пожарной тревоги в гостинице вы спали только 4 часа. Явка через 2 часа, впереди три рейса.","Mehmonxonadagi yongʻin signali tufayli faqat 4 soat uxladingiz. Ishga kelish 2 soatdan keyin, oldinda uchta reys."),
 o:[O(L("Run IMSAFE honestly and report fatigue to crew control through the fatigue reporting process.","Честно пройти IMSAFE и сообщить об усталости в службу планирования по установленной процедуре.","IMSAFE ni halol bajarish va belgilangan tartib boʻyicha rejalashtirish xizmatiga charchoq haqida xabar berish.")),
    O(L("Drink extra coffee and fly — it's only one bad night.","Выпить больше кофе и лететь — это всего одна плохая ночь.","Koʻproq qahva ichib uchish — bu atigi bitta yomon tun."),"OVERCONF"),
    O(L("Tell no one, but ask the first officer to fly all sectors.","Никому не говорить, но попросить второго пилота выполнить все рейсы.","Hech kimga aytmay, ikkinchi uchuvchidan barcha reyslarni bajarishni soʻrash."),"SOLO"),
    O(L("Take a sleeping pill now and report as normal.","Принять снотворное сейчас и явиться как обычно.","Hozir uyqu dori ichib, odatdagidek ishga kelish."),"NONSOP")],
 e:L("Fatigue impairs judgement much like alcohol. Assess yourself honestly and report it — that is a professional duty, not a weakness.","Усталость ухудшает суждения подобно алкоголю. Честно оцените себя и сообщите об этом — это профессиональная обязанность, а не слабость.","Charchoq fikrlashni alkogol kabi yomonlashtiradi. Oʻzingizni halol baholang va xabar bering — bu zaiflik emas, kasbiy burch.")},
{id:"s14",a:"HF",s:L("After hundreds of uneventful flights you notice you no longer check the FMS route against the ATC clearance.","После сотен спокойных рейсов вы замечаете, что перестали сверять маршрут в FMS с разрешением УВД.","Yuzlab tinch reyslardan soʻng FMS dagi yoʻnalishni HHB ruxsati bilan solishtirmay qoʻyganingizni payqaysiz."),
 o:[O(L("Recognise complacency and restore a deliberate cross-check with the other pilot.","Признать самоуспокоенность и восстановить осознанную перекрёстную проверку со вторым пилотом.","Xotirjamlikni tan olib, ikkinchi uchuvchi bilan ongli oʻzaro tekshiruvni tiklash.")),
    O(L("It's fine — the automation is reliable.","Всё в порядке — автоматика надёжна.","Hammasi joyida — avtomatika ishonchli."),"OVERCONF"),
    O(L("Check only on long or unfamiliar routes.","Проверять только на длинных или незнакомых маршрутах.","Faqat uzun yoki notanish yoʻnalishlarda tekshirish."),"NONSOP"),
    O(L("Stop using the FMS and fly raw data from now on.","Перестать пользоваться FMS и летать только по «сырым» данным.","FMS dan foydalanishni toʻxtatib, faqat xom maʼlumotlar boʻyicha uchish."),"HASTY")],
 e:L("Complacency grows with routine and reliable automation. The fix is a disciplined habit — verify, cross-check and call out — not abandoning the tools.","Самоуспокоенность растёт вместе с рутиной и надёжностью автоматики. Лекарство — дисциплинированная привычка проверять, сверять и докладывать, а не отказ от инструментов.","Xotirjamlik odatiy ish va ishonchli avtomatika bilan ortadi. Davosi — tekshirish, solishtirish va aytishga intizomli odat, vositalardan voz kechish emas.")},
{id:"s15",a:"FND",s:L("A LOSA observer on your flight records an error you made. You are worried about the consequences.","Наблюдатель LOSA на вашем рейсе фиксирует допущенную вами ошибку. Вы беспокоитесь о последствиях.","Reysingizdagi LOSA kuzatuvchisi siz yoʻl qoʻygan xatoni qayd etadi. Oqibatlaridan xavotirdasiz."),
 o:[O(L("Remember that LOSA is anonymous and non-jeopardy: the data improves the system, not discipline.","Помнить, что LOSA анонимен и не влечёт наказаний: данные служат улучшению системы, а не дисциплинарным мерам.","LOSA anonim va jazosiz ekanini yodda tutish: maʼlumotlar intizom uchun emas, tizimni yaxshilash uchun.")),
    O(L("Ask the observer to delete the record.","Попросить наблюдателя удалить запись.","Kuzatuvchidan yozuvni oʻchirishni soʻrash."),"NONSOP"),
    O(L("Fly differently from usual while you are observed.","Летать иначе, чем обычно, пока за вами наблюдают.","Kuzatilayotganda odatdagidan boshqacha uchish."),"NONSOP"),
    O(L("Refuse future observations.","Отказываться от будущих наблюдений.","Kelgusi kuzatuvlardan voz kechish."),"PASSIVE")],
 e:L("LOSA works only if crews fly normally. Observations are confidential and used to find system-level threats — part of a just culture.","LOSA работает, только если экипажи летают как обычно. Наблюдения конфиденциальны и используются для выявления системных угроз — это часть справедливой культуры.","LOSA faqat ekipajlar odatdagidek uchganda ishlaydi. Kuzatuvlar maxfiy va tizimli tahdidlarni aniqlash uchun ishlatiladi — bu adolatli madaniyatning bir qismi.")},
{id:"s16",a:"FND",s:L("A colleague says: “CRM is just soft talk. Technical skill is all that matters.”","Коллега говорит: «CRM — это просто разговоры. Важна только техника пилотирования».","Hamkasbingiz: «CRM — shunchaki gap. Faqat texnik mahorat muhim», deydi."),
 o:[O(L("Point out that most accidents involve non-technical failures, and that EBT assesses communication, leadership, SA, workload and decisions alongside technical skill.","Заметить, что в большинстве катастроф есть нетехнические сбои, а EBT оценивает коммуникацию, лидерство, осведомлённость, нагрузку и решения наравне с техникой пилотирования.","Koʻp halokatlarda notexnik xatolar borligini va EBT texnik mahorat bilan birga muloqot, yetakchilik, anglash, yuk va qarorlarni baholashini aytish.")),
    O(L("Agree — good hands solve everything.","Согласиться — хорошие руки решают всё.","Rozi boʻlish — yaxshi qoʻllar hamma narsani hal qiladi."),"OVERCONF"),
    O(L("Say nothing — it's not your business.","Промолчать — это не ваше дело.","Indamaslik — bu sizning ishingiz emas."),"PASSIVE"),
    O(L("Suggest training only manual flying.","Предложить тренировать только ручное пилотирование.","Faqat qoʻlda boshqarishni mashq qilishni taklif qilish."),"FIXATION")],
 e:L("CRM was created because investigations showed that most accidents involved breakdowns in teamwork, communication and decision making — not a lack of stick-and-rudder skill.","CRM появилась потому, что расследования показали: в большинстве катастроф решающую роль играли сбои командной работы, коммуникации и принятия решений, а не недостаток навыков пилотирования.","CRM tergovlar koʻp halokatlarda pilotaj mahorati yetishmasligi emas, balki jamoaviy ish, muloqot va qaror qabul qilishdagi uzilishlar sabab boʻlganini koʻrsatgani uchun yaratilgan.")}
];

/* =====================================================================
   ABBREVIATIONS  (key, expansion, category, meaning en/ru/uz)
   ===================================================================== */
const A=(k,f,c,en,ru,uz)=>({k,f,c,m:L(en,ru,uz)});
const ABBRS=[
/* CRM & human factors */
A("CRM","Crew Resource Management","CRM","Using all resources — people, equipment, information — for a safe flight","Управление ресурсами экипажа","Ekipaj resurslarini boshqarish"),
A("NOTECHS","Non-Technical Skills","CRM","European system of behavioural markers for pilots","Европейская система поведенческих маркеров пилотов","Uchuvchilar xulq-atvor belgilarining Yevropa tizimi"),
A("TEM","Threat and Error Management","CRM","Anticipating threats, catching errors, avoiding undesired states","Управление угрозами и ошибками","Tahdid va xatolarni boshqarish"),
A("UAS","Undesired Aircraft State","CRM","Unsafe position, speed or configuration caused by crew error","Нежелательное состояние воздушного судна","Nomaqbul havo kemasi holati"),
A("SA","Situation Awareness","CRM","Knowing what is happening now and what will happen next","Ситуационная осведомлённость","Vaziyatni anglash"),
A("PF","Pilot Flying","CRM","The pilot controlling the flight path","Пилотирующий пилот","Boshqaruvchi uchuvchi"),
A("PM","Pilot Monitoring","CRM","The pilot monitoring, handling radio and checklists","Контролирующий пилот","Nazoratchi uchuvchi"),
A("PNF","Pilot Not Flying","CRM","Older name for the pilot monitoring","Устаревшее название контролирующего пилота","Nazoratchi uchuvchining eski nomi"),
A("PIC","Pilot-in-Command","CRM","The pilot responsible for the flight (captain)","Командир воздушного судна","Havo kemasi komandiri"),
A("SIC","Second-in-Command","CRM","The co-pilot","Второй пилот","Ikkinchi uchuvchi"),
A("FO","First Officer","CRM","The co-pilot, usually in the right seat","Второй пилот","Ikkinchi uchuvchi"),
A("CM1","Crew Member 1","CRM","Left-seat pilot, usually the captain","Пилот в левом кресле, обычно командир","Chap oʻrindiqdagi uchuvchi, odatda kapitan"),
