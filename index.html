<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><body><main id="app"></main><script src="app.js"></script><script>
shell();const n=k=>col(k).length;
const IM={darslar:'Flight training',samolyotlar:'Boeing 737',kokpit:'Cockpit',qisqartmalar:'Air traffic control',lugat:'Airport',radio:'Aviation transponder',testlar:'Flight simulator'};
$('#app').innerHTML=`<section class=hero><div><h2>${S('welcome')}</h2><h1>${S('hello')}</h1><p class=intro>${S('intro')}</p><a class=btn href=darslar.html>${S('start')}</a></div>
<svg viewBox="0 0 400 220" fill="none" stroke="#4aa3ff" stroke-width="3" stroke-linejoin="round"><path d="M20 120 L330 100 Q385 98 385 112 Q385 126 330 128 L20 140Z" fill="#0c1a3a"/><path d="M150 112 L90 30 L120 30 L215 108Z M150 128 L90 205 L120 205 L215 130Z" fill="#12307a"/><path d="M20 120 L8 70 L40 72 L70 114Z" fill="#12307a"/></svg></section>
<div class=feat>${[['fp','fd','📖'],['sp','sd','✈'],['tp','td','🏆']].map(f=>`<div><b>${f[2]} ${S(f[0])}</b><span class=muted>${S(f[1])}</span></div>`).join('')}</div>

<div class=stats><div><b>${n('lessons')}</b>${S('cnt')}</div><div><b>${n('aircraft')}</b>${S('aircraft')}</div><div><b>${n('abbr')+n('lugat')}</b>${S('abbr')} + ${S('gloss')}</div><div><b>${Object.keys(DB.get('res',{})).length}</b>${S('tests')}</div></div>`;fillImgs($('#app'));
</script></body></html>
