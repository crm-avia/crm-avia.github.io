const CASES=[
K("tenerife","1977-03-27","KLM 4805 / Pan Am 1736","Boeing 747 ×2",L("Tenerife (Los Rodeos), Spain","Тенерифе (Лос-Родеос), Испания","Tenerife (Los-Rodeos), Ispaniya"),583,644,"TO",["LTW","COM","DM"],false,
 L("In fog, the KLM captain began the take-off roll without take-off clearance while the Pan Am 747 was still taxiing on the same runway. It remains the deadliest accident in aviation history.","В тумане командир KLM начал разбег без разрешения на взлёт, пока Boeing 747 Pan Am ещё рулил по той же полосе. Это до сих пор самая крупная катастрофа в истории авиации.","Tumanda KLM kapitani uchishga ruxsatsiz yugurishni boshladi, Pan Am Boeing 747 esa hali shu yoʻlakda rulyojka qilayotgan edi. Bu hanuz aviatsiya tarixidagi eng yirik halokat."),
 [L("Steep authority gradient: the captain was the airline's chief training pilot, and the crew hesitated to challenge him.","Крутой градиент власти: командир был главным пилотом-инструктором авиакомпании, и экипаж не решался ему возражать.","Tik hokimiyat gradienti: kapitan aviakompaniyaning bosh instruktor-uchuvchisi edi va ekipaj unga eʼtiroz bildirishga ikkilandi."),
  L("The flight engineer asked whether Pan Am was clear of the runway; the question was dismissed.","Бортинженер спросил, освободил ли Pan Am полосу, — вопрос был отклонён.","Bort muhandisi Pan Am yoʻlakni boʻshatdimi, deb soʻradi — savol rad etildi."),
  L("Non-standard phrases (“we are now at take-off”) and a blocked radio transmission created ambiguity.","Нестандартные фразы («мы сейчас на взлёте») и заблокированная радиопередача создали двусмысленность.","Nostandart iboralar («biz hozir uchishdamiz») va toʻsilgan radio uzatma noaniqlik yaratdi."),
  L("Time pressure from duty-time limits pushed a hasty decision.","Давление из-за ограничений рабочего времени подтолкнуло к поспешному решению.","Ish vaqti cheklovlari bosimi shoshilinch qarorga undadi.")],
 [L("The word “take-off” is now used only in the actual clearance; other messages use “departure”.","Слово «take-off» теперь используется только в самом разрешении на взлёт, в остальных сообщениях — «departure».","«Take-off» soʻzi endi faqat uchishga ruxsatning oʻzida ishlatiladi; boshqa xabarlarda — «departure»."),
  L("Any crew member's doubt must stop the action until it is resolved.","Сомнение любого члена экипажа должно останавливать действие до его разрешения.","Har qanday ekipaj aʼzosining shubhasi hal boʻlgunga qadar harakatni toʻxtatishi kerak.")]),
K("eal401","1972-12-29","Eastern Air Lines 401","Lockheed L-1011",L("Florida Everglades, USA","Эверглейдс, Флорида, США","Everglads, Florida, AQSh"),101,176,"APP",["SA","WLM","LTW"],false,
 L("All three flight-deck crew became absorbed in a burned-out landing-gear indicator bulb. The autopilot altitude hold was accidentally disengaged and the aircraft descended slowly into the swamp.","Все три члена лётного экипажа сосредоточились на перегоревшей лампочке индикатора шасси. Режим стабилизации высоты автопилота был случайно отключён, и самолёт плавно снизился в болото.","Uchala ekipaj aʼzosi shassi koʻrsatkichining kuygan lampochkasiga berilib ketdi. Avtopilotning balandlikni ushlab turish rejimi tasodifan oʻchib, samolyot sekin botqoqqa tushdi."),
 [L("Nobody was assigned to fly and monitor the aircraft.","Никому не было поручено пилотировать и контролировать самолёт.","Hech kimga samolyotni boshqarish va kuzatish topshirilmagan."),
  L("Fixation on a minor problem (tunnel vision).","Фиксация на мелкой проблеме (туннельное зрение).","Kichik muammoga qotib qolish (tunnel koʻrish)."),
  L("An altitude alert chime went unnoticed.","Сигнал отклонения от высоты остался незамеченным.","Balandlik ogohlantirish signali eʼtiborsiz qoldi.")],
 [L("In any abnormal situation, first decide who flies the aircraft.","В любой нештатной ситуации сначала определите, кто пилотирует.","Har qanday nostandart vaziyatda avval kim boshqarishini belgilang."),
  L("Match the effort to the size of the problem.","Соразмеряйте усилия с серьёзностью проблемы.","Kuchni muammo hajmiga moslang.")]),
K("ua173","1978-12-28","United Airlines 173","McDonnell Douglas DC-8",L("Portland, Oregon, USA","Портленд, Орегон, США","Portlend, Oregon, AQSh"),10,189,"APP",["DM","COM","WLM"],false,
 L("While the captain troubleshot a landing-gear problem for about an hour in a holding pattern, the aircraft ran out of fuel and crashed short of the airport.","Пока командир около часа разбирался с проблемой шасси в зоне ожидания, закончилось топливо, и самолёт упал, не долетев до аэропорта.","Kapitan kutish zonasida qariyb bir soat shassi muammosi bilan shugʻullanayotganda yoqilgʻi tugadi va samolyot aeroportga yetmay qulab tushdi."),
 [L("The captain fixated on the gear problem and lost track of fuel.","Командир зациклился на шасси и потерял контроль над топливом.","Kapitan shassiga qotib qolib, yoqilgʻini nazoratdan chiqardi."),
  L("The first officer and flight engineer mentioned fuel but did not state it forcefully.","Второй пилот и бортинженер упоминали топливо, но недостаточно настойчиво.","Ikkinchi uchuvchi va bort muhandisi yoqilgʻini tilga olishdi, lekin yetarlicha qatʼiy emas."),
  L("No time limit was set for troubleshooting.","Не был установлен лимит времени на поиск неисправности.","Nosozlikni aniqlash uchun vaqt chegarasi belgilanmagan.")],
 [L("This accident led United Airlines to launch the first comprehensive airline CRM programme in 1981.","Эта катастрофа побудила United Airlines запустить первую полноценную программу CRM в 1981 году.","Bu halokat United Airlines ni 1981-yilda birinchi toʻliq CRM dasturini boshlashga undadi."),
  L("Use assertive, specific statements: “We have fuel for 5 minutes — we must land now.”","Говорите настойчиво и конкретно: «Топлива на 5 минут — садимся немедленно».","Qatʼiy va aniq gapiring: «Yoqilgʻi 5 daqiqaga — darhol qoʻnamiz».")]),
K("af90","1982-01-13","Air Florida 90","Boeing 737-200",L("Washington, D.C. (Potomac River), USA","Вашингтон (река Потомак), США","Vashington (Potomak daryosi), AQSh"),78,79,"TO",["COM","LTW","TEM"],false,
 L("In snow, with engine anti-ice off, iced sensors gave falsely high thrust readings. The aircraft took off with too little thrust and struck a bridge over the Potomac; 4 people on the bridge were also killed.","В снегопад при выключенной ПОС двигателей обледеневшие датчики показывали завышенную тягу. Самолёт взлетел с недостаточной тягой и врезался в мост через Потомак; погибли также 4 человека на мосту.","Qor yogʻayotganda dvigatel muzlashga qarshi tizimi oʻchiq boʻlib, muzlagan datchiklar tortishni oshirib koʻrsatdi. Samolyot yetarli tortishsiz uchib, Potomak ustidagi koʻprikka urildi; koʻprikdagi 4 kishi ham halok boʻldi."),
 [L("During the take-off roll the first officer said several times that something was “not right”; the captain dismissed it.","На разбеге второй пилот несколько раз сказал, что что-то «не так», — командир отмахнулся.","Yugurishda ikkinchi uchuvchi bir necha bor nimadir «notoʻgʻri» dedi — kapitan eʼtibor bermadi."),
  L("Concerns were hinted at rather than stated as a clear challenge.","Опасения высказывались намёками, а не чётким требованием.","Xavotirlar aniq talab emas, ishora tarzida aytildi."),
  L("Winter-operations threats (anti-ice, de-icing hold-over time) were not managed.","Не управлялись угрозы зимней эксплуатации (ПОС, время защитного действия).","Qishki ekspluatatsiya tahdidlari (muzlashga qarshi tizim, himoya vaqti) boshqarilmadi.")],
 [L("Use PACE: escalate to a clear call to reject the take-off.","Используйте PACE: доведите до чёткой команды прекратить взлёт.","PACE dan foydalaning: uchishni toʻxtatish haqidagi aniq chaqiruvgacha kuchaytiring."),
  L("Cross-check engine indications against each other, not only against the target.","Сверяйте показания двигателей между собой, а не только с заданным значением.","Dvigatel koʻrsatkichlarini faqat maqsad bilan emas, oʻzaro ham solishtiring.")]),
K("av52","1990-01-25","Avianca 52","Boeing 707",L("Cove Neck, New York, USA","Коув-Нек, Нью-Йорк, США","Kouv-Nek, Nyu-York, AQSh"),73,158,"APP",["COM","DM","TEM"],false,
 L("After long holds and a missed approach at New York JFK, the aircraft ran out of fuel. The crew never used the word “emergency” with ATC.","После длительных ожиданий и ухода на второй круг в Нью-Йорке (JFK) закончилось топливо. Экипаж так и не произнёс в связи с УВД слово «emergency».","Nyu-Yorkda (JFK) uzoq kutish va ikkinchi aylanishdan soʻng yoqilgʻi tugadi. Ekipaj HHB bilan aloqada «emergency» soʻzini hech qachon aytmadi."),
 [L("The crew said “priority” and “running out of fuel”, which ATC did not treat as an emergency.","Экипаж говорил «приоритет» и «топливо заканчивается», что УВД не восприняло как аварийную ситуацию.","Ekipaj «ustuvorlik» va «yoqilgʻi tugayapti» dedi, HHB buni favqulodda holat deb qabul qilmadi."),
  L("Language barrier and non-standard phraseology.","Языковой барьер и нестандартная фразеология.","Til toʻsigʻi va nostandart frazeologiya."),
  L("No fuel plan or decision point for diversion.","Не было плана по топливу и рубежа решения об уходе на запасной.","Yoqilgʻi rejasi va zaxira aerodromga ketish boʻyicha qaror nuqtasi yoʻq edi.")],
 [L("Use standard words: “MAYDAY” and “minimum fuel” trigger defined ATC actions.","Используйте стандартные слова: «MAYDAY» и «minimum fuel» запускают определённые действия УВД.","Standart soʻzlardan foydalaning: «MAYDAY» va «minimum fuel» HHB ning belgilangan harakatlarini ishga tushiradi."),
  L("Close the loop: confirm that ATC understood how serious the situation is.","Замкните цикл: убедитесь, что УВД понял серьёзность ситуации.","Siklni yoping: HHB vaziyat jiddiyligini tushunganiga ishonch hosil qiling.")]),
K("kegworth","1989-01-08","British Midland 92","Boeing 737-400",L("Kegworth, United Kingdom","Кегворт, Великобритания","Kegvort, Buyuk Britaniya"),47,126,"APP",["LTW","SA","DM"],false,
 L("After a fan blade failed in the left engine, the pilots shut down the healthy right engine. The damaged engine then failed on approach.","После разрушения лопатки вентилятора левого двигателя пилоты выключили исправный правый. Повреждённый двигатель отказал на заходе.","Chap dvigatelda ventilyator kurakchasi singanidan soʻng uchuvchilar soz oʻng dvigatelni oʻchirishdi. Shikastlangan dvigatel yaqinlashishda ishdan chiqdi."),
 [L("The diagnosis was made in seconds and not cross-checked against the engine instruments.","Диагноз был поставлен за секунды и не сверён с приборами двигателей.","Tashxis soniyalarda qoʻyildi va dvigatel asboblari bilan tekshirilmadi."),
  L("Cabin crew and passengers saw flames from the left engine, but this never reached the flight deck.","Бортпроводники и пассажиры видели пламя из левого двигателя, но эта информация не дошла до кабины.","Bort kuzatuvchilari va yoʻlovchilar chap dvigateldan olovni koʻrishdi, ammo bu kokpitga yetib bormadi."),
  L("Confirmation bias: the vibration reduced after shutdown, seeming to confirm the wrong choice.","Склонность к подтверждению: после выключения вибрация уменьшилась и «подтвердила» неверный выбор.","Tasdiqlashga moyillik: oʻchirgandan soʻng tebranish kamaydi va notoʻgʻri tanlovni «tasdiqladi».")],
 [L("Verify before irreversible actions: both pilots confirm the engine.","Проверяйте перед необратимыми действиями: оба пилота подтверждают двигатель.","Qaytarib boʻlmaydigan harakatlardan oldin tekshiring: ikkala uchuvchi dvigatelni tasdiqlaydi."),
  L("Train flight deck and cabin together: the cabin is a source of information.","Готовьте кабину и салон вместе: салон — источник информации.","Kokpit va salonni birga tayyorlang: salon — axborot manbai.")]),
K("dryden","1989-03-10","Air Ontario 1363","Fokker F28",L("Dryden, Ontario, Canada","Драйден, Онтарио, Канада","Drayden, Ontario, Kanada"),24,69,"TO",["LTW","TEM","DM"],false,
 L("The aircraft took off with snow and ice on the wings, without de-icing, and failed to climb.","Самолёт взлетел со снегом и льдом на крыльях без противообледенительной обработки и не смог набрать высоту.","Samolyot qanotlarida qor va muz bilan, muzdan tozalanmasdan uchdi va balandlik ololmadi."),
 [L("A flight attendant and pilots travelling as passengers noticed snow on the wings but did not tell the captain.","Бортпроводница и пилоты, летевшие пассажирами, видели снег на крыльях, но не сообщили командиру.","Bort kuzatuvchisi va yoʻlovchi sifatida uchgan uchuvchilar qanotlardagi qorni koʻrishdi, lekin kapitanga aytishmadi."),
  L("Commercial and schedule pressure; the APU was unserviceable, complicating de-icing.","Коммерческое давление и график; неисправная ВСУ усложняла обработку.","Tijoriy bosim va jadval; nosoz APU muzdan tozalashni qiyinlashtirdi.")],
 [L("Cabin crew must be encouraged to report safety concerns to the flight deck.","Бортпроводников нужно поощрять сообщать в кабину о проблемах безопасности.","Bort kuzatuvchilarini xavfsizlik muammolari haqida kokpitga xabar berishga undash kerak."),
  L("The Moshansky inquiry led to major Canadian reforms in de-icing rules and cabin–flight deck communication.","Расследование комиссии Мошанского привело к крупным реформам в Канаде: правила обработки и связь салона с кабиной.","Moshanskiy komissiyasi tergovi Kanadada muzdan tozalash qoidalari va salon–kokpit aloqasida yirik islohotlarga olib keldi.")]),
K("su593","1994-03-23","Aeroflot 593","Airbus A310",L("Mezhdurechensk, Russia","Междуреченск, Россия","Mejdurechensk, Rossiya"),75,75,"CRZ",["SA","FND","WLM"],false,
 L("The captain let his teenage son sit at the controls. The boy's input partly disengaged the autopilot (aileron channel), and the aircraft rolled into a spiral dive.","Командир позволил сыну-подростку сесть за штурвал. Его воздействие частично отключило автопилот (канал элеронов), и самолёт вошёл в спираль.","Kapitan oʻsmir oʻgʻliga shturval ortida oʻtirishga ruxsat berdi. Uning taʼsiri avtopilotni qisman (eleron kanali) oʻchirib qoʻydi va samolyot spiralga tushdi."),
 [L("A serious breach of flight-deck discipline and SOPs.","Грубое нарушение дисциплины в кабине и SOP.","Kokpit intizomi va SOP ning qoʻpol buzilishi."),
  L("No pilot noticed the partial autopilot disconnect (mode awareness).","Никто из пилотов не заметил частичного отключения автопилота (осведомлённость о режимах).","Hech bir uchuvchi avtopilotning qisman oʻchganini payqamadi (rejimlarni anglash)."),
  L("Startle and confusion during the recovery attempt.","Испуг и растерянность при попытке вывода.","Chiqarishga urinishda choʻchish va sarosima.")],
 [L("The flight deck is a workplace: SOPs and the sterile flight deck are not optional.","Кабина — рабочее место: SOP и «стерильная» кабина обязательны.","Kokpit — ish joyi: SOP va «steril» kokpit majburiy."),
  L("Know how the automation behaves and monitor its modes.","Знайте логику автоматики и контролируйте её режимы.","Avtomatika mantiqini biling va uning rejimlarini kuzating.")]),
K("aa965","1995-12-20","American Airlines 965","Boeing 757",L("Near Cali, Colombia","Под Кали, Колумбия","Kali yaqinida, Kolumbiya"),159,163,"APP",["WLM","SA","DM"],false,
 L("The crew accepted a late runway change, rushed the descent and selected the wrong beacon in the FMS. The aircraft turned off course and hit a mountain.","Экипаж согласился на позднюю смену полосы, спешил на снижении и выбрал в FMS не тот радиомаяк. Самолёт отклонился от курса и врезался в гору.","Ekipaj kech oʻzgartirilgan yoʻlakka rozi boʻldi, pasayishda shoshildi va FMS da notoʻgʻri radiomayoqni tanladi. Samolyot yoʻnalishdan ogʻib, toqqa urildi."),
 [L("Accepting a runway change with too little time led to task saturation.","Принятие смены полосы при нехватке времени привело к перегрузке задачами.","Vaqt yetishmaganda yoʻlak oʻzgarishini qabul qilish haddan ortiq yuklanishga olib keldi."),
  L("The FMS entry was not cross-checked, and the turn went unnoticed.","Ввод в FMS не был перепроверен, разворот остался незамеченным.","FMS ga kiritish tekshirilmadi, burilish sezilmadi."),
  L("The approach was continued despite lost situation awareness.","Заход продолжался, несмотря на потерю осведомлённости.","Anglash yoʻqolganiga qaramay yaqinlashish davom ettirildi.")],
 [L("If unsure, buy time or abandon the approach.","Если сомневаетесь — выиграйте время или прекратите заход.","Ishonchingiz komil boʻlmasa — vaqt yuting yoki yaqinlashishni toʻxtating."),
  L("Verify every FMS change with the other pilot; step down the automation when confused.","Проверяйте каждое изменение в FMS со вторым пилотом; при путанице понижайте уровень автоматики.","FMS dagi har bir oʻzgarishni ikkinchi uchuvchi bilan tekshiring; chalkashlikda avtomatika darajasini pasaytiring.")]),
K("ke801","1997-08-06","Korean Air 801","Boeing 747-300",L("Guam, USA","Гуам, США","Guam, AQSh"),228,254,"APP",["LTW","COM","HF"],false,
 L("On a night non-precision approach with the glideslope out of service, the tired captain descended below the safe altitude and hit high ground short of the runway.","Ночью при неточном заходе с неработающей глиссадой уставший командир снизился ниже безопасной высоты и врезался в возвышенность перед полосой.","Tunda glissada ishlamayotgan noaniq yaqinlashuvda charchagan kapitan xavfsiz balandlikdan pastga tushib, yoʻlak oldidagi tepalikka urildi."),
 [L("The first officer and flight engineer did not challenge the captain effectively.","Второй пилот и бортинженер не смогли эффективно возразить командиру.","Ikkinchi uchuvchi va bort muhandisi kapitanga samarali eʼtiroz bildira olmadi."),
  L("A steep authority gradient and indirect, hinting speech.","Крутой градиент власти и косвенная речь намёками.","Tik hokimiyat gradienti va ishorali bilvosita nutq."),
  L("Captain fatigue and a weak approach briefing.","Усталость командира и слабый брифинг захода.","Kapitan charchogʻi va zaif yaqinlashuv brifingi.")],
 [L("Korean Air later rebuilt its training around CRM and an open flight deck culture.","Позднее Korean Air перестроила подготовку вокруг CRM и открытой культуры общения в кабине.","Keyinchalik Korean Air tayyorgarlikni CRM va kokpitdagi ochiq muloqot madaniyati atrofida qayta qurdi."),
  L("Brief non-precision approaches thoroughly and check altitude against distance.","Тщательно проводите брифинг неточных заходов и сверяйте высоту с удалением.","Noaniq yaqinlashuvlarni puxta brifing qiling va balandlikni masofaga nisbatan tekshiring.")]),
K("ke8509","1999-12-22","Korean Air Cargo 8509","Boeing 747-200F",L("London Stansted, United Kingdom","Лондон-Станстед, Великобритания","London-Stansted, Buyuk Britaniya"),4,4,"CLB",["LTW","COM","SA"],false,
 L("Shortly after take-off the captain's attitude indicator failed. The captain banked steeply following it, and the aircraft crashed.","Вскоре после взлёта отказал авиагоризонт командира. Следуя ему, командир ввёл самолёт в глубокий крен, и самолёт разбился.","Uchgandan soʻng koʻp oʻtmay kapitanning aviagorizonti ishdan chiqdi. Unga ergashib kapitan samolyotni chuqur kreniga kiritdi va u halokatga uchradi."),
 [L("The flight engineer called out the bank warning; the first officer stayed silent.","Бортинженер сообщил о предупреждении по крену; второй пилот промолчал.","Bort muhandisi kren ogohlantirishi haqida aytdi; ikkinchi uchuvchi jim qoldi."),
  L("A hierarchical culture stopped the first officer from challenging.","Иерархическая культура помешала второму пилоту возразить.","Ierarxik madaniyat ikkinchi uchuvchiga eʼtiroz bildirishga toʻsqinlik qildi."),
  L("The attitude indicators were not cross-checked.","Авиагоризонты не были сверены.","Aviagorizontlar solishtirilmadi.")],
 [L("Every pilot must call out a flight-path deviation, regardless of rank.","Любой пилот обязан сообщить об отклонении траектории независимо от должности.","Har qanday uchuvchi lavozimdan qatʼi nazar trayektoriya chetlanishini aytishi shart."),
  L("When indications disagree, compare all instruments.","При расхождении показаний сравнивайте все приборы.","Koʻrsatkichlar mos kelmasa, barcha asboblarni solishtiring.")]),
K("helios522","2005-08-14","Helios Airways 522","Boeing 737-300",L("Grammatiko, Greece","Грамматико, Греция","Grammatiko, Gretsiya"),121,121,"CLB",["SA","DM","FND"],false,
 L("The pressurisation mode selector was left in MANUAL after maintenance. The crew misread the cabin altitude warning as a take-off configuration warning and lost consciousness from hypoxia; the aircraft flew on autopilot until the fuel ran out.","После техобслуживания переключатель режима наддува остался в положении MANUAL. Экипаж принял сигнал высоты в кабине за предупреждение о взлётной конфигурации и потерял сознание от гипоксии; самолёт летел на автопилоте до выработки топлива.","Texnik xizmatdan soʻng bosim rejimi kaliti MANUAL holatida qoldi. Ekipaj kabina balandligi signalini uchish konfiguratsiyasi ogohlantirishi deb oʻyladi va gipoksiyadan hushidan ketdi; samolyot yoqilgʻi tugaguncha avtopilotda uchdi."),
 [L("Pre-flight and after-take-off checks missed the switch position.","Предполётная проверка и проверка после взлёта не выявили положение переключателя.","Parvoz oldi va uchishdan keyingi tekshiruvlar kalit holatini aniqlamadi."),
  L("Confirmation bias: the warning horn was taken for a familiar one.","Склонность к подтверждению: сигнал был принят за знакомый.","Tasdiqlashga moyillik: signal tanish signal deb qabul qilindi."),
  L("Communication difficulties between the pilots and with maintenance.","Трудности общения между пилотами и с техниками.","Uchuvchilar oʻrtasida va texniklar bilan muloqotdagi qiyinchiliklar.")],
 [L("When a warning appears, read it rather than recognise it, and use the QRH.","При сигнале читайте его, а не «узнавайте», и используйте QRH.","Signal paydo boʻlganda uni «tanimang», oʻqing va QRH dan foydalaning."),
  L("If pressurisation is in doubt, put on oxygen masks first.","При сомнении в наддуве сначала наденьте кислородные маски.","Bosimga shubha boʻlsa, avval kislorod niqoblarini taqing.")]),
K("comair5191","2006-08-27","Comair 5191","Bombardier CRJ100",L("Lexington, Kentucky, USA","Лексингтон, Кентукки, США","Leksington, Kentukki, AQSh"),49,50,"TO",["SA","WLM","COM"],false,
 L("In darkness the crew lined up on a short, unlit runway instead of the assigned long one and overran it on take-off.","В темноте экипаж вырулил на короткую неосвещённую полосу вместо назначенной длинной и выкатился за её пределы на взлёте.","Qorongʻida ekipaj belgilangan uzun yoʻlak oʻrniga qisqa, yoritilmagan yoʻlakka chiqib, uchishda undan chiqib ketdi."),
 [L("Non-pertinent conversation during taxi broke the sterile flight deck rule.","Посторонние разговоры при рулении нарушили правило «стерильной» кабины.","Rulyojka paytidagi begona suhbat «steril» kokpit qoidasini buzdi."),
  L("The runway heading was not cross-checked before take-off.","Курс полосы не был сверен перед взлётом.","Uchishdan oldin yoʻlak kursi tekshirilmadi.")],
 [L("Verify the runway (heading, signs, length) before every take-off.","Проверяйте полосу (курс, знаки, длину) перед каждым взлётом.","Har bir uchishdan oldin yoʻlakni tekshiring (kurs, belgilar, uzunlik)."),
  L("The sterile flight deck applies during taxi too.","Правило «стерильной» кабины действует и на рулении.","«Steril» kokpit qoidasi rulyojkada ham amal qiladi.")]),
K("perm821","2008-09-14","Aeroflot-Nord 821","Boeing 737-500",L("Perm, Russia","Пермь, Россия","Perm, Rossiya"),88,88,"APP",["HF","LTW","SA"],false,
 L("On a night approach the crew lost spatial orientation; the aircraft rolled over and crashed. The investigation found alcohol in the captain's body and weak training on the type.","Ночью на заходе экипаж потерял пространственную ориентировку; самолёт перевернулся и упал. Расследование выявило алкоголь в организме командира и слабую подготовку на типе.","Tunda yaqinlashishda ekipaj fazoviy moʻljalni yoʻqotdi; samolyot agʻdarilib qulab tushdi. Tergov kapitan organizmida alkogol va tur boʻyicha zaif tayyorgarlikni aniqladi."),
 [L("Fitness for duty was not ensured (alcohol, fatigue).","Не была обеспечена годность к полёту (алкоголь, усталость).","Parvozga yaroqlilik taʼminlanmadi (alkogol, charchoq)."),
  L("The first officer did not take control despite the captain's obvious impairment.","Второй пилот не взял управление, несмотря на явное состояние командира.","Ikkinchi uchuvchi kapitanning aniq holatiga qaramay boshqaruvni olmadi."),
  L("An unfamiliar Western-style attitude indicator contributed to disorientation.","Непривычный авиагоризонт западного типа способствовал дезориентации.","Notanish gʻarbiy turdagi aviagorizont dezoriyentatsiyaga hissa qoʻshdi.")],
 [L("IMSAFE is a personal duty, and crew members must speak up about a colleague's impairment.","IMSAFE — личная обязанность, а члены экипажа должны говорить о неработоспособности коллеги.","IMSAFE — shaxsiy burch, ekipaj aʼzolari esa hamkasbning ishga layoqatsizligi haqida aytishi kerak."),
  L("The two-challenge rule exists for incapacitation.","Правило двух обращений существует на случай недееспособности.","Ikki marta ogohlantirish qoidasi layoqatsizlik holati uchun mavjud.")]),
K("colgan3407","2009-02-12","Colgan Air 3407","Bombardier Q400",L("Buffalo, New York, USA","Буффало, Нью-Йорк, США","Buffalo, Nyu-York, AQSh"),50,49,"APP",["HF","WLM","SA"],false,
 L("On approach the speed decayed unnoticed. When the stick shaker activated, the captain pulled back instead of pushing forward, and the aircraft stalled; one person on the ground was also killed.","На заходе скорость незаметно упала. При срабатывании тряски штурвала командир взял штурвал на себя вместо отдачи, и самолёт сорвался в сваливание; погиб также один человек на земле.","Yaqinlashishda tezlik sezilmagan holda kamaydi. Shturval silkinishi ishga tushganda kapitan shturvalni oʻziga tortdi va samolyot sruvga tushdi; yerda ham bir kishi halok boʻldi."),
 [L("Non-pertinent conversation below 10,000 ft.","Посторонние разговоры ниже 10 000 футов.","10 000 futdan past begona suhbat."),
  L("Both pilots were fatigued after long commutes and poor rest.","Оба пилота были утомлены после долгой дороги на работу и плохого отдыха.","Ikkala uchuvchi ishga uzoq yoʻl va yomon dam olishdan charchagan edi."),
  L("Airspeed was not monitored, and startle led to the wrong response.","Скорость не контролировалась, а испуг привёл к неверной реакции.","Tezlik kuzatilmadi, choʻchish esa notoʻgʻri javobga olib keldi.")],
 [L("Led to new US pilot rest rules and training requirements.","Привела к новым правилам отдыха и требованиям к подготовке пилотов в США.","AQSh da uchuvchilar dam olishi va tayyorgarligiga oid yangi qoidalarga olib keldi."),
  L("Monitor speed actively in icing and train stall recovery.","Активно контролируйте скорость при обледенении и тренируйте вывод из сваливания.","Muzlashda tezlikni faol kuzating va sruvdan chiqishni mashq qiling.")]),
K("af447","2009-06-01","Air France 447","Airbus A330",L("Atlantic Ocean","Атлантический океан","Atlantika okeani"),228,228,"CRZ",["SA","COM","WLM"],false,
 L("Ice blocked the pitot tubes in cruise, the autopilot disconnected and airspeed readings became unreliable. The pilot flying pulled up and held the aircraft in a stall down to the ocean.","В крейсерском полёте лёд забил приёмники воздушного давления, автопилот отключился, показания скорости стали недостоверными. Пилотирующий взял штурвал на себя и удерживал самолёт в сваливании до самого океана.","Kruizda muz havo bosimi qabul qilgichlarini toʻsdi, avtopilot oʻchdi va tezlik koʻrsatkichlari ishonchsiz boʻldi. Boshqaruvchi uchuvchi shturvalni oʻziga tortib, samolyotni okeangacha sruvda ushlab turdi."),
 [L("Startle and surprise after the autopilot disconnect.","Испуг и неожиданность после отключения автопилота.","Avtopilot oʻchganidan keyingi choʻchish va kutilmaganlik."),
  L("No shared understanding of the situation; nobody called “stall”.","Не было общего понимания ситуации; никто не назвал «сваливание».","Vaziyat haqida umumiy tushuncha yoʻq edi; hech kim «sruv» demadi."),
  L("Unclear who was flying, with simultaneous control inputs; the captain returned late from his rest.","Было неясно, кто пилотирует, были одновременные воздействия на управление; командир поздно вернулся с отдыха.","Kim boshqarayotgani noaniq edi, bir vaqtda boshqaruv taʼsirlari boʻldi; kapitan dam olishdan kech qaytdi.")],
 [L("Unreliable airspeed: hold the memory-item pitch and thrust.","При недостоверной скорости выдерживайте тангаж и режим из пунктов на память.","Tezlik ishonchsiz boʻlsa, xotiradagi bandlar boʻyicha tangaj va rejimni saqlang."),
  L("Hand over control clearly: “I have control” / “You have control”.","Чётко передавайте управление: «Управление взял» / «Управление передал».","Boshqaruvni aniq topshiring: «Boshqaruvni oldim» / «Boshqaruvni berdim».")]),
K("tk1951","2009-02-25","Turkish Airlines 1951","Boeing 737-800",L("Amsterdam Schiphol, Netherlands","Амстердам (Схипхол), Нидерланды","Amsterdam (Sxiphol), Niderlandiya"),9,135,"APP",["SA","WLM","TEM"],false,
 L("A faulty radio altimeter made the autothrottle retard to idle during the approach. Three pilots on the flight deck did not notice the speed loss until the stall.","Неисправный радиовысотомер заставил автомат тяги убрать режим до малого газа на заходе. Три пилота в кабине не заметили падения скорости до сваливания.","Nosoz radiobalandlik oʻlchagich yaqinlashishda avtotortishni kichik gazga tushirdi. Kokpitdagi uchta uchuvchi sruvgacha tezlik pasayishini payqamadi."),
 [L("The crew was busy with a late, high approach (task saturation).","Экипаж был занят поздним и высоким заходом (перегрузка задачами).","Ekipaj kech va baland yaqinlashuv bilan band edi (haddan ortiq yuklanish)."),
  L("The automation mode (RETARD) was not monitored.","Режим автоматики (RETARD) не контролировался.","Avtomatika rejimi (RETARD) kuzatilmadi."),
  L("A known radio altimeter fault was not treated as a threat.","Известная неисправность радиовысотомера не была учтена как угроза.","Maʼlum radiobalandlik oʻlchagich nosozligi tahdid sifatida hisobga olinmadi.")],
 [L("Monitor the FMA and speed trend, especially when automation is degraded.","Контролируйте FMA и тенденцию скорости, особенно при деградации автоматики.","FMA va tezlik tendensiyasini kuzating, ayniqsa avtomatika buzilganda."),
  L("An unstable approach is a reason to go around.","Нестабилизированный заход — повод для ухода на второй круг.","Barqaror boʻlmagan yaqinlashuv — ikkinchi aylanish uchun sabab.")]),
K("ix812","2010-05-22","Air India Express 812","Boeing 737-800",L("Mangalore, India","Мангалор, Индия","Mangalor, Hindiston"),158,166,"LDG",["DM","LTW","HF"],false,
 L("After a high, fast, unstable approach the aircraft touched down far along a tabletop runway, overran it and fell into a gorge.","После высокого, скоростного, нестабилизированного захода самолёт приземлился далеко от начала полосы на плато, выкатился и упал в ущелье.","Baland, tez va barqaror boʻlmagan yaqinlashuvdan soʻng samolyot plato ustidagi yoʻlakning uzoq qismiga qoʻnib, chiqib ketdi va jarlikka qulab tushdi."),
 [L("The first officer called “go around” several times; the captain continued.","Второй пилот несколько раз призывал уйти на второй круг; командир продолжил посадку.","Ikkinchi uchuvchi bir necha bor ikkinchi aylanishga chaqirdi; kapitan qoʻnishni davom ettirdi."),
  L("Plan continuation bias despite EGPWS warnings.","Склонность к продолжению плана, несмотря на предупреждения EGPWS.","EGPWS ogohlantirishlariga qaramay rejani davom ettirishga moyillik."),
  L("The captain had slept for much of the flight (sleep inertia).","Командир спал большую часть полёта (инерция сна).","Kapitan parvozning katta qismida uxlagan (uyqu inertsiyasi).")],
 [L("A “go around” call from any crew member must be followed.","Команда «уход на второй круг» от любого члена экипажа должна выполняться.","Har qanday ekipaj aʼzosining «ikkinchi aylanish» chaqiruvi bajarilishi shart."),
  L("Allow recovery time after in-flight rest before critical phases.","Отводите время на восстановление после отдыха в полёте перед критическими этапами.","Parvozdagi dam olishdan soʻng muhim bosqichlar oldidan tiklanish vaqtini bering.")]),
K("oz214","2013-07-06","Asiana Airlines 214","Boeing 777-200ER",L("San Francisco, USA","Сан-Франциско, США","San-Fransisko, AQSh"),3,307,"APP",["SA","WLM","LTW"],false,
 L("On a visual approach the autothrottle entered a mode that did not hold speed. The aircraft became low and slow and struck the seawall short of the runway.","На визуальном заходе автомат тяги перешёл в режим, не выдерживающий скорость. Самолёт оказался низко и на малой скорости и ударился о дамбу перед полосой.","Vizual yaqinlashishda avtotortish tezlikni ushlab turmaydigan rejimga oʻtdi. Samolyot past va sekin boʻlib, yoʻlak oldidagi damba devoriga urildi."),
 [L("Mode confusion: the crew believed the autothrottle was protecting the speed.","Путаница режимов: экипаж считал, что автомат тяги поддерживает скорость.","Rejim chalkashligi: ekipaj avtotortish tezlikni saqlaydi deb oʻyladi."),
  L("Three pilots on the flight deck did not monitor the speed.","Три пилота в кабине не контролировали скорость.","Kokpitdagi uchta uchuvchi tezlikni kuzatmadi."),
  L("The go-around came too late; there was reluctance to intervene with a training captain.","Уход на второй круг начат слишком поздно; было нежелание вмешиваться в действия пилота-инструктора.","Ikkinchi aylanish juda kech boshlandi; instruktor-kapitan harakatlariga aralashishni istamaslik bor edi.")],
 [L("Understand automation modes and their limits.","Понимайте режимы автоматики и их ограничения.","Avtomatika rejimlarini va ularning cheklovlarini tushuning."),
  L("Define roles clearly on training flights: who monitors?","Чётко определяйте роли на тренировочных рейсах: кто контролирует?","Oʻquv reyslarida rollarni aniq belgilang: kim kuzatadi?")]),
K("kazan363","2013-11-17","Tatarstan Airlines 363","Boeing 737-500",L("Kazan, Russia","Казань, Россия","Qozon, Rossiya"),50,50,"APP",["SA","WLM","FND"],false,
 L("After an unstable approach the crew went around. They did not notice the autopilot was off, pitched up steeply, lost speed and then dived into the ground near the runway.","После нестабилизированного захода экипаж ушёл на второй круг. Не заметив отключения автопилота, пилоты сильно задрали нос, потеряли скорость и затем вошли в пикирование у полосы.","Barqaror boʻlmagan yaqinlashuvdan soʻng ekipaj ikkinchi aylanishga ketdi. Avtopilot oʻchganini payqamay, burunni keskin koʻtarishdi, tezlikni yoʻqotishdi va keyin yoʻlak yonida pikirovkaga tushishdi."),
 [L("Insufficient training in manual go-arounds.","Недостаточная подготовка к уходу на второй круг в ручном режиме.","Qoʻlda ikkinchi aylanish boʻyicha yetarli tayyorgarlik yoʻq edi."),
  L("Mode awareness was lost after the automation disconnected.","Осведомлённость о режимах была потеряна после отключения автоматики.","Avtomatika oʻchgandan keyin rejimlarni anglash yoʻqoldi."),
  L("The first officer did not intervene during the dive.","Второй пилот не вмешался при пикировании.","Ikkinchi uchuvchi pikirovkada aralashmadi.")],
 [L("Practise go-arounds as a normal, frequent manoeuvre.","Отрабатывайте уход на второй круг как обычный частый манёвр.","Ikkinchi aylanishni odatiy, tez-tez bajariladigan manyovr sifatida mashq qiling."),
  L("The monitoring pilot must call out pitch and speed deviations.","Контролирующий пилот обязан сообщать об отклонениях тангажа и скорости.","Nazoratchi uchuvchi tangaj va tezlik chetlanishlarini aytishi shart.")]),
K("qz8501","2014-12-28","Indonesia AirAsia 8501","Airbus A320",L("Java Sea","Яванское море","Yava dengizi"),162,162,"CRZ",["COM","LTW","DM"],false,
 L("A recurring rudder-limiter fault led the crew to reset flight computer circuit breakers in flight. The autopilot disconnected, the aircraft rolled and climbed, and it stalled into the sea.","Повторяющийся отказ ограничителя хода руля направления привёл к тому, что экипаж в полёте перезапустил АЗС бортовых вычислителей. Автопилот отключился, самолёт накренился, набрал высоту и сорвался в сваливание.","Takrorlanuvchi yoʻnalish ruli cheklovchisi nosozligi tufayli ekipaj parvozda hisoblagichlar avtomatlarini qayta yoqdi. Avtopilot oʻchdi, samolyot krenga tushdi, balandlik oldi va sruvga uchradi."),
 [L("A non-standard action (circuit-breaker reset) not covered by procedures.","Нестандартное действие (перезапуск АЗС), не предусмотренное процедурами.","Tartiblarda nazarda tutilmagan nostandart harakat (avtomatlarni qayta yoqish)."),
  L("An ambiguous command from the captain (“pull down”) during the upset.","Двусмысленная команда командира («pull down») при сложном положении.","Murakkab holatda kapitanning ikki maʼnoli buyrugʻi («pull down»)."),
  L("Conflicting control inputs and no clear transfer of control.","Противоречивые действия по управлению и нечёткая передача управления.","Qarama-qarshi boshqaruv harakatlari va boshqaruvni aniq topshirmaslik.")],
 [L("Stick to the QRH and consult before non-standard actions.","Придерживайтесь QRH и советуйтесь перед нестандартными действиями.","QRH ga amal qiling va nostandart harakatlardan oldin maslahatlashing."),
  L("Use precise, standard commands in emergencies.","В аварийной обстановке используйте точные стандартные команды.","Favqulodda holatda aniq, standart buyruqlardan foydalaning.")]),
/* positive outcomes */
K("ua232","1989-07-19","United Airlines 232","McDonnell Douglas DC-10",L("Sioux City, Iowa, USA","Су-Сити, Айова, США","Su-Siti, Ayova, AQSh"),112,296,"CRZ",["LTW","WLM","COM"],true,
 L("An uncontained engine failure destroyed all three hydraulic systems. The crew steered with engine thrust alone and reached the runway; 184 of 296 people survived.","Нелокализованный отказ двигателя уничтожил все три гидросистемы. Экипаж управлял только тягой двигателей и довёл самолёт до полосы; выжили 184 из 296 человек.","Dvigatelning lokalizatsiya qilinmagan nosozligi uchala gidrotizimni yoʻq qildi. Ekipaj faqat dvigatel tortishi bilan boshqarib, yoʻlakkacha yetib keldi; 296 kishidan 184 tasi omon qoldi."),
 [L("The captain invited an off-duty instructor pilot travelling as a passenger to help, and shared the tasks.","Командир привлёк летевшего пассажиром пилота-инструктора и распределил задачи.","Kapitan yoʻlovchi sifatida uchayotgan instruktor-uchuvchini yordamga chaqirdi va vazifalarni taqsimladi."),
  L("Open communication and calm decision making under extreme workload.","Открытое общение и спокойное принятие решений при экстремальной нагрузке.","Haddan ortiq yuklamada ochiq muloqot va xotirjam qaror qabul qilish."),
  L("Cabin crew and emergency services were prepared in advance.","Бортпроводники и аварийные службы были заранее подготовлены.","Bort kuzatuvchilari va favqulodda xizmatlar oldindan tayyorlangan.")],
 [L("Captain Al Haynes credited CRM training for the lives saved.","Командир Эл Хейнс назвал CRM-подготовку причиной спасения людей.","Kapitan Al Xeyns hayotlar saqlanib qolganini CRM tayyorgarligi bilan bogʻladi."),
  L("Use every available resource, including people outside the crew.","Используйте все доступные ресурсы, включая людей вне экипажа.","Barcha mavjud resurslardan, jumladan ekipajdan tashqaridagi odamlardan foydalaning.")]),
K("us1549","2009-01-15","US Airways 1549","Airbus A320",L("Hudson River, New York, USA","Река Гудзон, Нью-Йорк, США","Gudzon daryosi, Nyu-York, AQSh"),0,155,"CLB",["DM","LTW","WLM"],true,
 L("Bird strikes caused both engines to lose thrust shortly after take-off. The crew decided to ditch in the Hudson River, and all 155 people survived.","Столкновение с птицами вскоре после взлёта привело к потере тяги обоих двигателей. Экипаж принял решение приводниться на реку Гудзон, и все 155 человек выжили.","Uchgandan soʻng qushlar bilan toʻqnashuv ikkala dvigatel tortishini yoʻqotdi. Ekipaj Gudzon daryosiga qoʻnishga qaror qildi va barcha 155 kishi omon qoldi."),
 [L("Clear division of roles: the captain flew, the first officer ran the checklist.","Чёткое разделение ролей: командир пилотировал, второй пилот выполнял чек-лист.","Rollarning aniq taqsimlanishi: kapitan boshqardi, ikkinchi uchuvchi nazorat roʻyxatini bajardi."),
  L("A fast, realistic decision: the options were evaluated within seconds.","Быстрое и реалистичное решение: варианты были оценены за секунды.","Tez va real qaror: variantlar soniyalarda baholandi."),
  L("The cabin crew carried out the evacuation efficiently.","Бортпроводники эффективно провели эвакуацию.","Bort kuzatuvchilari evakuatsiyani samarali oʻtkazdi.")],
 [L("Aviate first, then decide within the time available.","Сначала пилотируйте, затем решайте в пределах располагаемого времени.","Avval boshqaring, soʻng mavjud vaqt doirasida qaror qiling."),
  L("Training and teamwork turn a crisis into a survivable event.","Подготовка и командная работа превращают кризис в ситуацию, которую можно пережить.","Tayyorgarlik va jamoaviy ish inqirozni omon qolish mumkin boʻlgan holatga aylantiradi.")]),
K("qf32","2010-11-04","Qantas 32","Airbus A380",L("Singapore","Сингапур","Singapur"),0,469,"CLB",["WLM","DM","LTW"],true,
 L("An uncontained engine failure damaged wiring, fuel and hydraulic systems and produced dozens of ECAM messages. The pilots on board worked through them and landed safely back in Singapore.","Нелокализованный отказ двигателя повредил проводку, топливную и гидравлическую системы и вызвал десятки сообщений ECAM. Пилоты на борту отработали их и благополучно вернулись в Сингапур.","Dvigatelning lokalizatsiya qilinmagan nosozligi simlar, yoqilgʻi va gidrotizimlarni shikastladi va oʻnlab ECAM xabarlarini chiqardi. Bortdagi uchuvchilar ularni bajarib, Singapurga xavfsiz qaytib qoʻndi."),
 [L("The workload was shared among five pilots on board, each with a clear role.","Нагрузка была распределена между пятью пилотами на борту, у каждого — своя роль.","Yuklama bortdagi besh uchuvchi oʻrtasida taqsimlandi, har birining oʻz roli bor edi."),
  L("The crew did not rush: they took time to understand what still worked before landing.","Экипаж не спешил: перед посадкой разобрался, что ещё работает.","Ekipaj shoshilmadi: qoʻnishdan oldin nima hali ishlayotganini aniqladi."),
  L("Focus on what works rather than on everything that failed.","Фокус на том, что работает, а не на всём, что отказало.","Ishlamay qolgan hamma narsaga emas, ishlayotganiga eʼtibor.")],
 [L("Buying time is a valid decision when the aircraft is under control.","Выиграть время — правильное решение, если самолёт управляем.","Samolyot boshqariladigan boʻlsa, vaqt yutish — toʻgʻri qaror."),
  L("Use every resource: extra pilots, ATC, the company and the cabin crew.","Используйте все ресурсы: дополнительных пилотов, УВД, компанию и бортпроводников.","Barcha resurslardan foydalaning: qoʻshimcha uchuvchilar, HHB, kompaniya va bort kuzatuvchilari.")])
];

    ["A · Alert",L("State the problem and the risk: “Speed is 10 kt below VREF, we are getting slow.”","Назовите проблему и риск: «Скорость на 10 узлов ниже VREF, теряем скорость».","Muammo va xavfni ayting: «Tezlik VREF dan 10 uzel past, sekinlashyapmiz».")],

    ["U",L("“I'm Uncomfortable” — I don't think we should continue.","«Мне некомфортно» — думаю, продолжать не стоит.","«Menga noqulay» — davom etmasligimiz kerak deb oʻylayman.")],

 s:[["F · Facts",L("What is happening? Gather facts from instruments, crew and ATC.","Что происходит? Соберите факты: приборы, экипаж, УВД.","Nima boʻlyapti? Asboblar, ekipaj va HHB dan faktlarni yigʻing.")],
    ["O · Options",L("List at least two options.","Назовите минимум два варианта.","Kamida ikkita variantni ayting.")],

    ["D · Diagnose",L("What is the problem? Use the whole crew and all systems.","В чём проблема? Используйте весь экипаж и все системы.","Muammo nima? Butun ekipaj va barcha tizimlardan foydalaning.")],

    ["R · Review",L("Is the plan still right? Did we miss anything?","Верен ли ещё план? Ничего не упустили?","Reja hali ham toʻgʻrimi? Nimadir qoldimi?")]]},

    ["1981",L("United Airlines starts the first comprehensive CRM course (1st generation: “Cockpit” RM, management styles).","United Airlines запускает первый полноценный курс CRM (1-е поколение: «Cockpit» RM, стили управления).","United Airlines birinchi toʻliq CRM kursini boshlaydi (1-avlod: «Cockpit» RM, boshqaruv uslublari).")],
    ["1986",L("2nd generation: “Crew” RM — team dynamics, briefings, decision making.","2-е поколение: «Crew» RM — командная динамика, брифинги, принятие решений.","2-avlod: «Crew» RM — jamoa dinamikasi, brifinglar, qaror qabul qilish.")],
    ["1990s",L("3rd–4th generations: cabin crew, dispatchers and maintenance included; CRM built into technical training and LOFT.","3–4-е поколения: включены бортпроводники, диспетчеры и техники; CRM встроена в техническую подготовку и LOFT.","3–4-avlodlar: bort kuzatuvchilari, dispetcherlar va texniklar qoʻshildi; CRM texnik tayyorgarlik va LOFT ga kiritildi.")],
    ["1997",L("5th generation: error management — errors are inevitable, so detect and contain them.","5-е поколение: управление ошибками — ошибки неизбежны, их нужно выявлять и сдерживать.","5-avlod: xatolarni boshqarish — xatolar muqarrar, ularni aniqlash va cheklash kerak.")],
    ["2000s",L("6th generation: Threat and Error Management, supported by LOSA data.","6-е поколение: управление угрозами и ошибками на основе данных LOSA.","6-avlod: LOSA maʼlumotlariga tayangan tahdid va xatolarni boshqarish.")],
    ["2013+",L("EBT and competency-based training turn CRM skills into assessed competencies.","EBT и подготовка на основе компетенций превращают навыки CRM в оцениваемые компетенции.","EBT va kompetensiyaga asoslangan tayyorgarlik CRM koʻnikmalarini baholanadigan kompetensiyalarga aylantiradi.")]]},

{t:L("Monitoring and challenging fail most often","Чаще всего отказывают контроль и способность возразить","Koʻpincha nazorat va eʼtiroz bildirish ishlamaydi"),
 b:L("In most cases at least one person saw or suspected the problem — a flight engineer, a first officer, a flight attendant — but the message did not get through or was not acted on. This matches the NTSB finding of 84%.","В большинстве случаев хотя бы один человек видел или подозревал проблему — бортинженер, второй пилот, бортпроводник, — но сообщение не дошло или не было принято. Это совпадает с выводом NTSB (84%).","Koʻp hollarda kamida bir kishi muammoni koʻrgan yoki sezgan — bort muhandisi, ikkinchi uchuvchi, bort kuzatuvchisi — lekin xabar yetib bormagan yoki unga amal qilinmagan. Bu NTSB xulosasiga (84%) mos keladi.")},
{t:L("Approach and landing are the riskiest phases","Заход и посадка — самые опасные этапы","Yaqinlashish va qoʻnish — eng xavfli bosqichlar"),
 b:L("{n} of the {t} accident cases here happened on approach, go-around or landing — the phases with the highest workload and the most decisions under time pressure. Boeing's worldwide data show the same pattern.","{n} из {t} рассмотренных катастроф произошли на заходе, уходе на второй круг или посадке — этапах с наибольшей нагрузкой и решениями в условиях дефицита времени. Мировые данные Boeing показывают ту же картину.","Bu yerdagi {t} ta halokatdan {n} tasi yaqinlashish, ikkinchi aylanish yoki qoʻnishda sodir boʻlgan — eng yuqori yuklama va vaqt bosimi ostidagi qarorlar bosqichlarida. Boeing ning jahon maʼlumotlari ham xuddi shunday.")},
{t:L("From hierarchy to automation","От иерархии к автоматике","Ierarxiyadan avtomatikaga"),
 b:L("Before 2000 the typical failure is a steep authority gradient (Tenerife, Korean Air 801 and 8509). After 2000, automation mode confusion and weak manual skills dominate (Air France 447, Asiana 214, Tatarstan 363). CRM training has shifted to match.","До 2000 года типичная проблема — крутой градиент власти (Тенерифе, Korean Air 801 и 8509). После 2000 года преобладают путаница режимов автоматики и слабые навыки ручного пилотирования (Air France 447, Asiana 214, «Татарстан» 363). CRM-подготовка изменилась соответственно.","2000-yilgacha odatiy muammo — tik hokimiyat gradienti (Tenerife, Korean Air 801 va 8509). 2000-yildan keyin avtomatika rejimlari chalkashligi va qoʻlda boshqarishdagi zaif koʻnikmalar ustun (Air France 447, Asiana 214, Tatarstan 363). CRM tayyorgarligi ham shunga moslashdi.")},
{t:L("Fixation keeps repeating","Фиксация повторяется","Qotib qolish takrorlanadi"),
 b:L("Eastern 401, United 173 and Kegworth show crews absorbed in one problem while a bigger one develops. The cure is simple: one pilot always flies and monitors.","Eastern 401, United 173 и Кегворт показывают экипажи, поглощённые одной проблемой, пока развивается более серьёзная. Лекарство простое: один пилот всегда пилотирует и контролирует.","Eastern 401, United 173 va Kegvort ekipajlar katta muammo rivojlanayotganda bitta muammoga berilib ketganini koʻrsatadi. Davo oddiy: bir uchuvchi doim boshqaradi va kuzatadi.")},
{t:L("Plan continuation kills on approach","Продолжение плана губительно на заходе","Yaqinlashishda rejani davom ettirish halokatli"),
 b:L("Air India Express 812, Turkish 1951 and Asiana 214 continued unstable approaches. With 97% of unstable approaches continued, a go-around culture is one of the strongest safety tools available.","Air India Express 812, Turkish 1951 и Asiana 214 продолжали нестабилизированные заходы. При том, что 97% таких заходов продолжаются, культура ухода на второй круг — одно из сильнейших средств безопасности.","Air India Express 812, Turkish 1951 va Asiana 214 barqaror boʻlmagan yaqinlashuvlarni davom ettirdi. Bunday yaqinlashuvlarning 97% davom ettirilishini hisobga olsak, ikkinchi aylanish madaniyati eng kuchli xavfsizlik vositalaridan biri.")},
{t:L("Good CRM saves lives","Хорошая CRM спасает жизни","Yaxshi CRM hayotni saqlaydi"),
 b:L("United 232, US Airways 1549 and Qantas 32 share three habits: clear roles, use of every available resource and disciplined time management.","United 232, US Airways 1549 и Qantas 32 объединяют три привычки: чёткие роли, использование всех доступных ресурсов и дисциплинированное управление временем.","United 232, US Airways 1549 va Qantas 32 uchta odatga ega: aniq rollar, barcha mavjud resurslardan foydalanish va vaqtni intizomli boshqarish.")},
{t:L("Rules are written after accidents","Правила пишутся после катастроф","Qoidalar halokatlardan keyin yoziladi"),
 b:L("United 173 led to the first CRM course, Tenerife to standard take-off phraseology, Dryden to Canadian de-icing reforms, Colgan 3407 to new US rest rules. Learning from these cases costs far less than repeating them.","United 173 привела к первому курсу CRM, Тенерифе — к стандартной фразеологии взлёта, Драйден — к реформе противообледенительных правил в Канаде, Colgan 3407 — к новым правилам отдыха в США. Учиться на этих случаях намного дешевле, чем повторять их.","United 173 birinchi CRM kursiga, Tenerife — standart uchish frazeologiyasiga, Drayden — Kanadada muzdan tozalash islohotiga, Colgan 3407 — AQSh dagi yangi dam olish qoidalariga olib keldi. Bu holatlardan oʻrganish ularni takrorlashdan ancha arzon.")}

const t=(k,v)=>{let s=UI[lang][k]??UI.en[k]??k;if(v)for(const x in v)s=s.split("{"+x+"}").join(v[x]);return s};
const tr=o=>o==null?"":typeof o==="string"?o:(o[lang]||o.en);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dayKey=d=>{d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const DAY=864e5, INTERVALS=[0,1,3,7,14];
const aspectById=id=>ASPECTS.find(a=>a.id===id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmtN=n=>n.toLocaleString(lang==="en"?"en-US":lang==="ru"?"ru-RU":"uz-UZ");

/* abbreviation highlighting: wraps known abbreviations in tappable spans */
const ABBR_MAP=Object.fromEntries(ABBRS.map(a=>[a.k,a]));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&");
const ABBR_RE=new RegExp("(?<![\\p{L}\\p{N}])("+ABBRS.map(a=>a.k).sort((a,b)=>b.length-a.length).map(reEsc).join("|")+")(s?)(?![\\p{L}])","gu");
function rich(raw){
  raw=String(raw??""); let out="",last=0;
  for(const m of raw.matchAll(ABBR_RE)){
    out+=esc(raw.slice(last,m.index));
    out+=`<span class="ab-t" role="button" tabindex="0" data-ab="${esc(m[1])}">${esc(m[1])}</span>`;
    out+=m[2]; last=m.index+m[0].length;
  }
  return out+esc(raw.slice(last));
}

function isDue(st,now){return st&&st.s>0&&now-st.l>=INTERVALS[st.b-1]*DAY}
function aspectStats(a){
  const its=ITEMS.filter(i=>i.a===a);
  let lv=0,seen=0;
  for(const i of its){const st=P.items[i.id];if(st&&st.s){seen++;lv+=(st.b-1)/4}}
  const mastery=Math.round(lv/its.length*100);
  const rec=P.log.filter(x=>x.a===a).slice(-20);
  const acc=rec.length?rec.reduce((s,x)=>s+x.c,0)/rec.length:null;
  const score=acc==null?mastery:0.6*mastery+0.4*acc*100;
  return {a,mastery,acc,n:rec.length,seen,total:its.length,score};
}
function abbrStats(){const known=ABBR_ITEMS.filter(i=>{const st=P.items[i.id];return st&&st.b>=3}).length;const tried=ABBR_ITEMS.filter(i=>P.items[i.id]).length;return {known,tried,total:ABBR_ITEMS.length}}
function analysis(){
  const now=Date.now();
  const stats=ASPECTS.map(x=>aspectStats(x.id));
  const overall=Math.round(stats.reduce((s,x)=>s+x.mastery,0)/stats.length);
  const answers=P.log.length;
  const accAll=answers?P.log.reduce((s,x)=>s+x.c,0)/answers:null;
  const due=ITEMS.filter(i=>isDue(P.items[i.id],now));
  let streak=0;{const d=new Date();if(!P.days[dayKey(d)])d.setDate(d.getDate()-1);while(P.days[dayKey(d)]){streak++;d.setDate(d.getDate()-1)}}
  const trapEntries=Object.entries(P.traps).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  return {stats,overall,answers,accAll,due,streak,trapEntries,abbr:abbrStats()};
}

function recommendations(A){

  }
  if(A.due.length)out.push({cls:"due",title:t("rec_due_t",{n:A.due.length}),body:t("rec_due"),btns:[["smart","",t("btn_review")]]});
  const second=ranked[1];
  if(second&&second.score<60){const s2=aspectById(second.a);
    out.push({cls:"focus",title:t("rec_focus_t",{a:tr(s2.n)}),body:second.n?t("rec_focus",{m:second.mastery,r:second.acc==null?"—":Math.round(second.acc*100)+"%"}):t("rec_unseen"),tips:[tr(s2.t[0])],btns:[["aspect",second.a,t("btn_practise")]]});}
  if(A.abbr.known<A.abbr.total*0.5&&A.answers>=10)out.push({cls:"info",title:t("rec_abbr_t",{k:A.abbr.known,n:A.abbr.total}),body:t("rec_abbr"),btns:[["abbr","",t("btn_abbr")]]});
  const unread=ASPECTS.filter(a=>!P.studied[a.id]);

  return out;
}

function record(item,correct,trap,kind){
  const now=Date.now();
  const st=P.items[item.id]||{b:1,s:0,c:0,l:0};
  st.s++; if(correct){st.c++;st.b=Math.min(5,st.b+1)}else st.b=1; st.l=now;
  P.items[item.id]=st;
  P.log.push({i:item.id,a:item.a,c:correct?1:0,t:now,k:kind});
  if(P.log.length>600)P.log=P.log.slice(-600);
  const dk=dayKey(); P.days[dk]=(P.days[dk]||0)+1;
  const keys=Object.keys(P.days).sort(); if(keys.length>90)for(const k of keys.slice(0,keys.length-90))delete P.days[k];
  if(trap)P.traps[trap]=(P.traps[trap]||0)+1;
  if(S){const gap=Math.min(now-S.lastT,180000);P.timeMs+=gap;S.lastT=now}
  saveSoon();
}

function buildQueue(mode,aspect){
  const now=Date.now();
  let pool=mode==="abbr"?ABBR_ITEMS:ITEMS;
  if(mode==="scn")pool=pool.filter(i=>i.kind==="scn");
  if(mode==="cases")pool=pool.filter(i=>i.kind==="case");
  if(mode==="flash")pool=pool.filter(i=>i.kind==="term");
  if(aspect&&aspect!=="ALL")pool=pool.filter(i=>i.a===aspect);
  const sc={};ASPECTS.forEach(a=>sc[a.id]=aspectStats(a.id).score);
  const n=Math.min(mode==="flash"||mode==="abbr"?12:10,pool.length);
  const w=pool.map(i=>{const st=P.items[i.id];let x=!st||!st.s?2:isDue(st,now)?(st.b===1?5:3):0.35;
    if(mode==="smart"){x*=1+(100-sc[i.a])/50;if(i.kind!=="term")x*=1.3} return x});
  const out=[],used=new Set();
  while(out.length<n){let tot=0;pool.forEach((p,k)=>{if(!used.has(k))tot+=w[k]});let r=Math.random()*tot,pick=-1;
    for(let k=0;k<pool.length;k++){if(used.has(k))continue;r-=w[k];if(r<=0){pick=k;break}}
    if(pick<0)pick=pool.findIndex((p,k)=>!used.has(k)); used.add(pick); out.push(pool[pick]);}
  return out.map(i=>makeQ(i,mode));
}
function maskDef(term){
  let d=tr(term.d);
  const parts=[term.ab,...(term.ab||"").split(/\s*\/\s*/)].filter(x=>x&&x.length>1);
  for(const p of parts)d=d.split(p).join("▢▢▢");
  return d;
}
function pickOthers(item,count,filter){
  const same=shuffle(TERMS.filter(x=>x!==item.ref&&x.a===item.a&&filter(x)));
  const rest=shuffle(TERMS.filter(x=>x!==item.ref&&x.a!==item.a&&filter(x)));
  return [...same.slice(0,2),...rest].slice(0,count);
}
function makeQ(item,mode){
  if(item.kind==="scn")return {item,type:"scn",opts:shuffle(item.ref.o.map(o=>({lab:o.t,ok:o.ok,trap:o.tr})))};
  if(item.kind==="case"){
    const c=item.ref, wrong=shuffle(ASPECTS.filter(a=>!c.aspects.includes(a.id))).slice(0,3);
    return {item,type:"case",opts:shuffle([{asp:c.aspects[0],ok:true},...wrong.map(a=>({asp:a.id,ok:false}))])};
  }
  if(item.kind==="abbr"){
    const r=item.ref;
    const seen=new Set([r.f]);
    const pool=shuffle(ABBR_ITEMS.filter(x=>x!==item)).sort((a,b)=>(b.ref.c===r.c)-(a.ref.c===r.c));
    const others=[];for(const o of pool){if(others.length===3)break;if(!seen.has(o.ref.f)){seen.add(o.ref.f);others.push(o.ref)}}
    return {item,type:"abbrq",opts:shuffle([{full:r.f,ok:true},...others.map(o=>({full:o.f,ok:false}))])};
  }
  if(mode==="flash")return {item,type:"flash"};
  const r=item.ref;
  if(r.ab&&r.full&&Math.random()<0.4){
    const others=pickOthers(item,3,x=>x.full);
    return {item,type:"abbr",opts:shuffle([{full:r.full,ok:true},...others.map(o=>({full:o.full,ok:false}))])};
  }
  const others=pickOthers(item,3,()=>true);
  return {item,type:"def",opts:shuffle([{term:r,ok:true},...others.map(o=>({term:o,ok:false}))])};
}
const termLabel=x=>{const n=tr(x.n);return x.ab&&!n.includes(x.ab)?n+" ("+x.ab+")":n};
function optLabel(o){return o.lab?tr(o.lab):o.full?o.full:o.asp?tr(aspectById(o.asp).n):termLabel(o.term)}
function startSession(mode,aspect){

  P.sessions++; tab="train"; render(); window.scrollTo(0,0);
}

function radarSVG(stats){
  const cx=170,cy=150,R=100,n=stats.length;
  const pt=(i,r)=>{const ang=(-90+i*360/n)*Math.PI/180;return [cx+r*Math.cos(ang),cy+r*Math.sin(ang)]};
  let g="";
  for(const f of [.25,.5,.75,1]){g+=`<polygon points="${stats.map((s,i)=>pt(i,R*f).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`}
  stats.forEach((s,i)=>{const [x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`});
  const poly=stats.map((s,i)=>pt(i,Math.max(R*s.mastery/100,2)).join(",")).join(" ");
  g+=`<polygon points="${poly}" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  stats.forEach((s,i)=>{const [x,y]=pt(i,Math.max(R*s.mastery/100,2));g+=`<circle cx="${x}" cy="${y}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>${esc(tr(aspectById(s.a).n))}: ${s.mastery}%</title></circle>`});
  stats.forEach((s,i)=>{const [x,y]=pt(i,R+24);const anchor=Math.abs(x-cx)<8?"middle":x>cx?"start":"end";
    g+=`<text x="${x}" y="${y-2}" text-anchor="${anchor}" class="lbl">${s.a}</text><text x="${x}" y="${y+12}" text-anchor="${anchor}">${s.mastery}%</text>`});
  g+=`<text x="${cx+4}" y="${cy-R*.5-3}">50</text><text x="${cx+4}" y="${cy-R-3}">100</text>`;
  return `<svg class="radar" viewBox="0 0 340 300" role="img" aria-label="${esc(t("radar"))}">${g}</svg>`;
}
function activitySVG(){
  const days=[];const d=new Date();d.setDate(d.getDate()-13);
  for(let i=0;i<14;i++){days.push({k:dayKey(d),v:P.days[dayKey(d)]||0,lab:pad(d.getDate())+"."+pad(d.getMonth()+1)});d.setDate(d.getDate()+1)}
  const max=Math.max(5,...days.map(x=>x.v)),W=300,H=96,top=14,bot=18,bw=W/14;

    else g+=`<rect x="${i*bw+3}" y="${H-bot-2}" width="${bw-6}" height="2" fill="var(--line)"/>`;});

   <div class="level"><div class="big"><span class="pct">${n?Math.round(c/n*100):0}<span style="font-size:28px">%</span></span><span class="name">${esc(t("scoreLine",{c,n}))}</span></div></div>
   <div><h3 class="sect" style="font-size:15px">${esc(t("byAspect"))}</h3>
   <div class="atable">${Object.entries(by).map(([a,v])=>{const p=Math.round(v.c/v.n*100);return `<div class="arow" style="cursor:default"><span class="code">${a==="ABR"?"ABR":a}</span><span>${esc(name(a))}</span><span class="bar"><i style="width:${p}%;background:${colorFor(p)}"></i></span><span class="num">${v.c}/${v.n}</span><span class="num">${p}%</span></div>`}).join("")}</div></div>
   ${rec?`<div><p class="prompt" style="margin-bottom:6px">${esc(t("nextFocus"))}</p>${recHTML({...rec,btns:[]})}</div>`:""}
   <div class="row" style="justify-content:flex-end"><button class="btn" data-go="toHome">${esc(t("toProgress"))}</button><button class="btn primary" data-go="again">${esc(t("again"))}</button></div></div></div>`;
}

/* =====================================================================
   ABBREVIATION POPOVER
   ===================================================================== */
let popFor=null;
function hidePop(){const p=document.getElementById("abPop");if(p)p.hidden=true;popFor=null}
function showPop(el){
  const a=ABBR_MAP[el.dataset.ab]; if(!a)return;
  if(popFor===el){hidePop();return}
  let p=document.getElementById("abPop");
  if(!p){p=document.createElement("div");p.id="abPop";p.setAttribute("role","tooltip");document.body.appendChild(p)}
  p.innerHTML=`<div class="pk">${esc(a.k)}</div><div class="pf">${esc(a.f)}</div><div class="pm">${esc(tr(a.m))}</div><span class="arrow"></span>`;
  p.hidden=false; p.className="";
  const r=el.getBoundingClientRect(), vw=document.documentElement.clientWidth;
  const pw=Math.min(300,vw-24); p.style.width=pw+"px";
  const ph=p.offsetHeight;
  let left=r.left+r.width/2-pw/2; left=Math.max(12,Math.min(left,vw-pw-12));
  let top=r.top-ph-10, below=false;
  if(top<8){top=r.bottom+10;below=true}
  p.style.left=(left+window.scrollX)+"px"; p.style.top=(top+window.scrollY)+"px";
  p.classList.toggle("below",below);
  const arrow=p.querySelector(".arrow"); arrow.style.left=Math.max(12,Math.min(r.left+r.width/2-left,pw-12))+"px";
  popFor=el;
}

/* =====================================================================
   EVENTS
   ===================================================================== */
let toastTimer;
function toast(m){const r=document.getElementById("toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>r.innerHTML="",2600)}
function setTab(k){tab=k;try{localStorage.setItem("crmTrainerTab",k)}catch(e){}render();window.scrollTo(0,0)}

document.querySelector(".seg").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;lang=b.dataset.lang;try{localStorage.setItem("crmTrainerLang",lang)}catch(_){ }render()});
document.addEventListener("click",e=>{
  const ab=e.target.closest(".ab-t");
  if(ab){e.preventDefault();showPop(ab);return}
  if(!e.target.closest("#abPop"))hidePop();
  const tb=e.target.closest("[data-tab]");if(tb){const k=tb.dataset.tab;if(k==="learn")lessonId=null;if(k==="train"&&S&&S.done)S=null;setTab(k);return}
  const gf=e.target.closest("[data-gf]");if(gf){gAspect=gf.dataset.gf;render();return}
  const gc=e.target.closest("[data-gc]");if(gc){gCat=gc.dataset.gc;render();return}
  const gs=e.target.closest("[data-gsub]");if(gs){gSub=gs.dataset.gsub;render();return}
  const ls=e.target.closest("[data-lsub]");if(ls){learnSub=ls.dataset.lsub;render();return}
  const cf=e.target.closest("[data-cf]");if(cf){caseFilter=cf.dataset.cf;render();return}
  const an=e.target.closest("[data-ans]");if(an&&!an.disabled){answer(Number(an.dataset.ans));return}
  const g=e.target.closest("[data-go]");if(!g)return;
  const act=g.dataset.go,arg=g.dataset.arg;
  switch(act){
    case "lesson": lessonId=arg; learnSub="lessons"; setTab("learn"); break;
    case "lessonBack": lessonId=null; render(); break;
    case "markStudied": P.studied[arg]=true; saveSoon(); render(); break;
    case "casesFor": caseFilter=arg; openCaseId=null; setTab("cases"); break;
    case "openCase": caseFilter="ALL"; openCaseId=arg; setTab("cases"); {const el=document.getElementById("case-"+arg);if(el)el.scrollIntoView({block:"start"})} break;
    case "smart": startSession("smart",null); break;
    case "aspect": startSession("aspect",arg); break;
    case "aspectSel": startSession("aspect",document.getElementById("selAspect").value); break;
    case "scn": startSession("scn",null); break;
    case "casesQuiz": startSession("cases",null); break;
    case "abbr": startSession("abbr",null); break;
    case "flash": startSession("flash",arg); break;
    case "flashSel": startSession("flash",document.getElementById("selFlash").value); break;
    case "flip": S.flipped=true; render(); break;
    case "fYes": rateFlash(true); break;
    case "fNo": rateFlash(false); break;
    case "next": nextQ(); break;
    case "quit": if(S.res.length){S.done=true}else S=null; render(); break;
    case "again": startSession(S.mode,S.aspect); break;
    case "toHome": S=null; setTab("home"); break;
    case "resetAsk": resetAsk=true; render(); break;
    case "resetNo": resetAsk=false; render(); break;
    case "resetYes": P=blank(); resetAsk=false; saveSoon(); clearTimeout(saveTimer); flush(); render(); toast(t("resetDone")); break;
  }
});
window.addEventListener("resize",hidePop);
document.addEventListener("input",e=>{if(e.target.id==="gq"){gq=e.target.value;render()}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){hidePop();return}
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("ab-t")){e.preventDefault();showPop(e.target);return}
  if(tab!=="train"||!S||S.done)return;
  if(e.target.matches("input,select,textarea"))return;
  const q=S.q[S.i];
  if(q.type==="flash"){
    if(e.key===" "&&!S.flipped){e.preventDefault();S.flipped=true;render()}
    else if(S.flipped&&e.key==="1")rateFlash(true);
    else if(S.flipped&&e.key==="2")rateFlash(false);
    return;
  }
  if(S.pick==null&&/^[1-4]$/.test(e.key)){const k=Number(e.key)-1;if(q.opts[k])answer(k)}
  else if(S.pick!=null&&(e.key==="Enter"||e.key==="ArrowRight")){e.preventDefault();nextQ()}
});

/* =====================================================================
   BOOT
   ===================================================================== */
render();
(async()=>{
  const c=window.claude; if(!c||!c.use)return;
  let db=null,user=null;
  try{[db,user]=await Promise.all([c.use("db"),c.use("user")])}catch(e){}
  if(!db||!user)return;
  let uid=null; try{uid=await user.id()}catch(e){}
  if(!uid)return;
  try{
    docRef=db.doc("data/users/"+uid+"/progress");
    const snap=await docRef.get();
    store="account";
    if(snap.exists){
      const remote=snap.data();
      if(remote&&remote.v===1&&(remote.updatedAt||0)>=(P.updatedAt||0)){P={...blank(),...JSON.parse(JSON.stringify(remote))};saveLocal()}
      else if(P.log.length) flush();
    } else if(P.log.length||Object.keys(P.studied).length){ flush(); }
    if(!S)render();
  }catch(e){store="device";docRef=null;if(!S)render()}
})();

</script>
