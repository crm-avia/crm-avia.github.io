<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CRM Skills Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: flight-deck study app — navy header band with tab strip, one working column; progress shown as an instrument-style competency radar */
:root{
  --bg:#ECF0F3; --surface:#FFFFFF; --sunk:#F3F6F9; --ink:#14222F; --muted:#5B6C7C; --line:#D2DBE3;
  --band:#132A43; --band-ink:#E6EEF6; --band-muted:#9FB3C8;
  --accent:#1D5BA8; --accent-ink:#FFFFFF; --accent-soft:#E2ECF8;
  --good:#1D7A4A; --good-bg:#E1F2E8; --warn:#9A5B00; --warn-bg:#FBEFD9; --bad:#B42318; --bad-bg:#FBE4E1; --neu-bg:#E8EDF2;
  --f-display:"Oswald","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D141B; --surface:#152029; --sunk:#111A22; --ink:#E2EAF1; --muted:#93A4B4; --line:#283744;
  --band:#0A1824; --band-ink:#E2EAF1; --band-muted:#8EA3B8;
  --accent:#6EA6EC; --accent-ink:#0B1622; --accent-soft:#1A2D44;
  --good:#5BCB92; --good-bg:#14301F; --warn:#F2B451; --warn-bg:#36290F; --bad:#F27B6E; --bad-bg:#3A1A17; --neu-bg:#1D2A35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#152029; --sunk:#111A22; --ink:#E2EAF1; --muted:#93A4B4; --line:#283744;
  --band:#0A1824; --band-ink:#E2EAF1; --band-muted:#8EA3B8;
  --accent:#6EA6EC; --accent-ink:#0B1622; --accent-soft:#1A2D44;
  --good:#5BCB92; --good-bg:#14301F; --warn:#F2B451; --warn-bg:#36290F; --bad:#F27B6E; --bad-bg:#3A1A17; --neu-bg:#1D2A35; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h2,h3{text-wrap:balance}

header.top{background:var(--band);color:var(--band-ink)}
.top-row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:18px 14px}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand-mark{flex:none;width:42px;height:42px;border:1.5px solid var(--band-muted);border-radius:50%;display:grid;place-items:center}
.brand h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.brand p{margin:2px 0 0;color:var(--band-muted);font-size:12.5px}
.lang{display:flex;align-items:center;gap:8px}
.lang span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--band-muted)}
.seg{display:flex;border:1px solid var(--band-muted);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--band-ink);padding:6px 11px;font-family:var(--f-mono);font-size:12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--band-muted)}
.seg button[aria-pressed="true"]{background:var(--band-ink);color:var(--band)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);border-top:1px solid rgba(159,179,200,.18)}
nav.tabs .navrow{display:flex;align-items:center;gap:10px}
.tabscroll{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
.tabscroll::-webkit-scrollbar{display:none}
nav.tabs .lang{flex:none;padding-block:6px}
@media (max-width:640px){#langLbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}nav.tabs .seg button{padding:6px 9px}}
.tabscroll button{flex:none;background:none;border:0;color:var(--band-muted);padding:11px 12px 10px;font-family:var(--f-display);font-weight:500;font-size:14px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent}
.tabscroll button[aria-current="page"]{color:var(--band-ink);border-bottom-color:var(--accent)}

main{padding-block:22px 56px;display:grid;gap:18px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.sync.dev::before{background:var(--warn)}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.head h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:26px;letter-spacing:.03em}
.lead{margin:0;color:var(--muted);max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.panel h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.panel .sub{color:var(--muted);font-size:12.5px;margin:2px 0 14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:9px 15px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:6px 11px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* level card */
.level{display:grid;gap:14px}
.level .big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.level .pct{font-family:var(--f-display);font-size:56px;line-height:1;font-weight:500}
.level .name{font-family:var(--f-display);font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.meter{height:8px;background:var(--sunk);border-radius:4px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.meter-scale{display:grid;grid-template-columns:repeat(4,1fr);font-size:11px;color:var(--muted);letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:20px;font-weight:500}

.radar{width:100%;max-width:380px;display:block;margin:0 auto}
.radar text{font-family:var(--f-mono);font-size:12px;fill:var(--muted)}
.radar .lbl{fill:var(--ink);font-weight:500}

/* recommendations */
.recs{display:grid;gap:12px}
.rec{display:grid;grid-template-columns:4px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px 14px 0;overflow:hidden}
.rec .stripe{border-radius:0 3px 3px 0}
.rec.focus .stripe{background:var(--bad)} .rec.trap .stripe{background:var(--warn)} .rec.due .stripe{background:var(--accent)} .rec.info .stripe{background:var(--muted)} .rec.good .stripe{background:var(--good)}
.rec h4{margin:0 0 3px;font-size:15.5px}
.rec p{margin:0 0 8px;color:var(--muted);font-size:14px}
.rec ul{margin:0 0 10px;padding-left:18px;font-size:14px}
.rec ul li{margin:2px 0}

/* aspect table */
.atable{display:grid;gap:2px}
.arow{display:grid;grid-template-columns:44px minmax(0,1.4fr) minmax(80px,1fr) 52px 60px;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.arow:first-child{border-top:0}
.arow:hover{background:var(--sunk)}
.arow.hd{cursor:default;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.arow.hd:hover{background:none}
.code{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--accent)}
.bar{height:8px;background:var(--sunk);border-radius:4px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.num{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){.arow{grid-template-columns:40px minmax(0,1fr) 52px 54px}.arow .bar,.arow .hbar{display:none}}

.activity svg{width:100%;height:auto;display:block}
.activity text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}

/* learn */
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.acard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;display:grid;gap:8px;align-content:start}
.acard:hover{border-color:var(--accent)}
.acard .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.acard h3{margin:0;font-size:17px;font-weight:600}
.acard p{margin:0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.acard .foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--neu-bg);color:var(--muted)}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--accent-soft);color:var(--accent)}
.lesson{display:grid;gap:18px}
.lesson .intro{font-size:16.5px;max-width:68ch;margin:0}
.tips{margin:0;padding-left:20px;display:grid;gap:6px}
.concepts{display:grid;gap:0}
.term{padding:14px 0;border-top:1px solid var(--line);display:grid;gap:4px}
.term:first-child{border-top:0;padding-top:4px}
.term .tt{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.term .tt strong{font-size:16px}
.ab{font-family:var(--f-mono);font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:4px}
.term .full{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.term p{margin:0;max-width:72ch}

/* glossary */
.gtools{display:grid;gap:10px}
.search{width:100%;max-width:440px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.gcount{font-size:12.5px;color:var(--muted)}

/* trainer */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;align-content:space-between}
.mode.rec-mode{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mode h3{margin:0;font-size:17px}
.mode p{margin:0;color:var(--muted);font-size:13.5px}
.mode select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--sunk)}
.session{max-width:760px;width:100%;margin:0 auto;display:grid;gap:16px}
.sbar{display:flex;align-items:center;gap:12px}
.sbar .meter{flex:1}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:grid;gap:16px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qtext{font-size:18px;line-height:1.5;margin:0}
.qtext.def{font-size:17px;border-left:3px solid var(--accent);padding-left:14px}
.qtext .big{font-family:var(--f-mono);font-size:28px;font-weight:500;color:var(--accent)}
.prompt{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:11px 14px;cursor:pointer;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:12px;width:24px;height:24px;border-radius:5px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .k{background:var(--good);color:var(--surface);border-color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt.dim{opacity:.6}
.fb{border-radius:8px;padding:12px 14px;display:grid;gap:6px;font-size:14.5px}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)}
.fb strong{font-size:15px}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)}
.fb p{margin:0}
.flash{min-height:180px;display:grid;place-items:center;text-align:center;gap:10px;padding:10px}
.flash .term-big{font-size:24px;font-weight:600}
.flash .def{max-width:56ch;font-size:16px}
.hint{font-size:12px;color:var(--muted);text-align:center}
.sumgrid{display:grid;gap:8px}
.confirm{color:var(--bad);font-size:14px}
.method{font-size:12.5px;color:var(--muted);max-width:75ch;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:6px;font-size:13.5px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.qcard{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(6px);opacity:.5}}}

/* --- v2 additions --- */
.kpis{grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:400}
.subnav{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.subnav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.subnav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.sect{margin:0 0 10px;font-family:var(--f-display);font-weight:500;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.lbl-s{font-size:12px;color:var(--muted)}

/* tappable abbreviations */
.ab-t{color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px;text-decoration-thickness:1.5px;cursor:pointer;border-radius:3px}
.ab-t:hover{background:var(--accent-soft)}
.ab .ab-t{color:inherit}
#abPop{position:absolute;z-index:40;background:var(--ink);color:var(--surface);border-radius:8px;padding:10px 12px;box-shadow:0 6px 24px rgba(10,20,30,.25);font-size:13.5px;line-height:1.4}
#abPop .pk{font-family:var(--f-mono);font-weight:500;font-size:14px}
#abPop .pf{font-weight:600;margin:2px 0 4px}
#abPop .pm{opacity:.85}
#abPop .arrow{position:absolute;bottom:-6px;width:12px;height:12px;background:var(--ink);transform:translateX(-50%) rotate(45deg)}
#abPop.below .arrow{bottom:auto;top:-6px}
@media (prefers-reduced-motion:no-preference){#abPop:not([hidden]){animation:pop .12s ease-out}@keyframes pop{from{opacity:0;transform:translateY(4px)}}}

/* toolkit */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px;align-items:start}
.steps{margin:0;display:grid;gap:0}
.steps>div{display:grid;grid-template-columns:minmax(92px,auto) minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.steps>div:first-child{border-top:0}
.steps>div.single{grid-template-columns:minmax(0,1fr)}
.steps dt{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--accent)}
.steps dd{margin:0;font-size:14.5px}

/* cases */
.cases{display:grid;gap:14px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:10px;scroll-margin-top:calc(60px + env(safe-area-inset-top,0px))}
.case.pos{border-color:var(--good)}
.case-h{display:flex;gap:14px;align-items:baseline}
.case .yr{font-size:22px;font-weight:500;color:var(--muted);flex:none}
.case-t{min-width:0}
.case h3{margin:0;font-size:18px}
.case .meta{font-size:13px;color:var(--muted)}
.case .what{margin:0;max-width:75ch}
.case details summary{cursor:pointer;font-weight:600;color:var(--accent);padding:4px 0;width:max-content}
.case-d{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:8px}
@media (max-width:700px){.case-d{grid-template-columns:minmax(0,1fr)}}
.case-d h4{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.case-d ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:14.5px}
.mini-cases{display:grid;gap:6px}
.mini-case{display:flex;gap:12px;align-items:center;flex-wrap:wrap;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer}
.mini-case:hover{border-color:var(--accent)}
.qcase{display:grid;gap:8px}
.hintlist{margin:0;padding-left:18px;color:var(--muted);font-size:14px}

/* statistics */
.stiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.stile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.stile .sv{font-family:var(--f-display);font-size:38px;line-height:1;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
.stile.good .sv{color:var(--good)}
.stile .sl{font-size:14px}
.ss{font-size:12px;color:var(--muted);font-family:var(--f-mono);margin:0}
.hb{display:grid;gap:8px}
.hb-row{display:grid;grid-template-columns:minmax(0,min(40%,200px)) minmax(60px,1fr) auto;gap:10px;align-items:center}
.hb-l{font-size:13.5px;line-height:1.25}
.hb-t{height:14px;background:var(--sunk);border-radius:0 4px 4px 0;position:relative}
.hb-t i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:0 4px 4px 0}
.hb-v{font-family:var(--f-mono);font-size:13px;text-align:right;min-width:36px}
.hb-v small{color:var(--muted)}
.insights{display:grid;gap:10px}
.insight{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.insight .num-i{color:var(--accent);font-weight:500;font-size:15px}
.insight h4{margin:0 0 4px;font-size:15.5px}
.insight p{margin:0;color:var(--ink);font-size:14.5px;max-width:78ch}
.srcs{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.srcs a{color:var(--accent);overflow-wrap:anywhere}

/* abbreviation list */
.abl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:0 24px}
.abr{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.big-ab{font-size:13px;justify-self:start}
.abf{font-weight:600;font-size:14px}
.abm{color:var(--muted);font-size:13.5px}

.vids{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.vid{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 12px 8px 8px;max-width:100%;min-width:0}
.vid:hover{border-color:var(--bad)}
.vid .play{flex:none;width:34px;height:24px;border-radius:6px;background:var(--bad);position:relative}
.vid .play::after{content:"";position:absolute;left:13px;top:6px;border-left:10px solid var(--surface);border-top:6px solid transparent;border-bottom:6px solid transparent}
.vid .vt{display:block;font-weight:500;font-size:14px;line-height:1.3}
.vid .vs{display:block;font-size:12px;color:var(--muted)}
.vmore{font-size:13.5px;color:var(--accent)}
